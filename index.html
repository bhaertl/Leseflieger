// ---------- ⚡ Satz-Blitzlesen ----------
const FALLBACK_W=["Fahrrad","Schule","Wolke","Banane","Pullover","Turnhalle"];
function initBlitz(){
  const S=shuffle(splitSentences(fullText(st.unit,st.lv)).filter(s=>{const n=wordCount(s);return n>=4&&n<=16;})).slice(0,6);
  const allW=[...new Set(toks(fullText(st.unit,st.lv)).map(clean).filter(w=>w.length>=4))];
  st.d.items=S.map(s=>{ const W=toks(s).map(clean).filter(Boolean); const caps=W.slice(1).filter(w=>/^[A-ZÄÖÜ]/.test(w)&&w.length>=4);
    const target=(caps.length?shuffle(caps)[0]:W.slice().sort((a,b)=>b.length-a.length)[0]);
    const inS=new Set(W.map(w=>w.toLowerCase()));
    let dis=shuffle(allW.filter(w=>!inS.has(w.toLowerCase())&&/^[A-ZÄÖÜ]/.test(w)===/^[A-ZÄÖÜ]/.test(target)));
    dis=[...new Set(dis)].slice(0,2); FALLBACK_W.forEach(f=>{ if(dis.length<2&&!inS.has(f.toLowerCase())) dis.push(f); });
    return {s,target,o:shuffle([target,...dis])}; });
  st.d.i=0; st.d.ph="ready"; st.d.t={}; }
function vFlowB(){
  const d=st.d, u=st.unit; let h=topBar(`⚡ Satz-Blitzlesen: ${esc(u.title)}`,"go('acts')"); const it=d.items[d.i];
  h+=`<div class="steps">${d.items.map((x,i)=>`<span class="st ${i===d.i?"cur":i<d.i?"done":""}">${i+1}</span>`).join("")}</div><div class="card">`;
  if(d.ph==="ready") h+=`<p class="instr">Gleich blitzt ein Satz auf – nur ganz kurz! Lies ihn schnell und genau. Danach kommt eine Frage.</p><div class="blitz" style="font-size:2.5rem">👀</div><div class="row" style="justify-content:center"><button class="btn orange" onclick="blitzShowS()">⚡ Satz zeigen</button></div>`;
  if(d.ph==="flash") h+=`<div class="blitz sblitz">${esc(it.s)}</div>`;
  if(d.ph==="ask"){ const t=d.t;
    h+=`<p class="q">Welches Wort stand im Satz?</p>`+it.o.map(o=>{let c=""; if(t.done&&o===it.target)c="ok"; else if((t.bad||[]).includes(o))c="bad"; return `<button class="opt ${c}" onclick="blitzAns(this.dataset.o)" data-o="${esc(o)}">${esc(o)}</button>`;}).join("");
    if(t.done) h+=`<div class="fb ${t.ok?"ok":"info"}">${t.ok?(t.first?"🌟 Richtig!":"👍 Richtig!"):"💡 Das richtige Wort ist grün."}</div><p class="instr mt">Der Satz war: <b>${esc(it.s)}</b></p><div class="row mt"><span class="sp"></span><button class="btn green" onclick="blitzNext()">${d.i<d.items.length-1?"Nächster Satz ➜":"Fertig ➜"}</button></div>`;
    else { if(t.tries) h+=`<div class="fb bad">Noch nicht. Versuch es nochmal!</div>`; if(!t.again) h+=`<div class="row mt"><button class="btn sec small" onclick="st.d.t.again=true;st.d.t.tries=(st.d.t.tries||0)+1;blitzShowS()">🔁 Nochmal zeigen</button></div>`; } }
  h+=`</div>`; return h;
}
function blitzShowS(){ const d=st.d, it=d.items[d.i]; d.ph="flash"; render(); const per={1:520,2:420,3:340}[st.lv]*(st.mode==="class"?1.3:1)*(st.daz?1.3:1);
  clearTimers(); TIMERS.push(setTimeout(()=>{ if(st.screen==="flowB"){ d.ph="ask"; render(); } }, 600+wordCount(it.s)*per)); }
function blitzAns(o){ const d=st.d, t=d.t, it=d.items[d.i]; if(t.done)return; if(o===it.target){t.done=true;t.ok=true;t.first=!t.tries; if(t.first)d.sc++;} else { t.bad=t.bad||[]; t.bad.push(o); t.tries=(t.tries||0)+1; if(t.tries>=2){t.done=true;t.ok=false;} } render(); }
function blitzNext(){ const d=st.d; d.mx++; if(d.i<d.items.length-1){ d.i++; d.ph="ready"; d.t={}; render(); return; }
  finishFlow("f",Math.max(1,d.sc),[`${d.sc} von ${d.items.length} Sätzen beim ersten Versuch richtig.`],id=>({k:id,t:Date.now(),kind:"b",u:st.unit.id,lv:st.lv,sc:d.sc,mx:d.items.length,mode:st.mode})); }

// ---------- 🤥 Lügentext ----------
function liesOf(u){ return u.type==="custom"?(u.lies||[]):(LIES[u.id]||[]); }
function buildLies(u,lv){ const T=toks(fullText(u,lv)); const used=new Set(), out=[];
  liesOf(u).forEach(([a,b])=>{ const na=norm(a); const i=T.findIndex((t,j)=>!used.has(j)&&norm(t)===na); if(i<0)return; if(out.some(o=>o.a===na))return; used.add(i);
    const m=T[i].match(/^([^A-Za-zÄÖÜäöüß0-9]*)(.*?)([^A-Za-zÄÖÜäöüß0-9]*)$/); out.push({i,a:na,orig:T[i],lie:m[1]+b+m[3]}); });
  return out.slice(0,5); }
function initLie(){ const u=st.unit; let L=buildLies(u,st.lv); if(L.length>5) L=shuffle(L).slice(0,5); st.d.lies=L; st.d.found=[]; st.d.wrong=0; st.d.rev=false; }
function vFlowL(){
  const u=st.unit, d=st.d, L=d.lies; const T=toks(fullText(u,st.lv)); const map={}; L.forEach(x=>map[x.i]=x);
  let h=topBar(`🤥 Lügentext: ${esc(u.title)}`,"go('acts')");
  const all=d.found.length===L.length||d.rev;
  h+=`<div class="card"><p class="instr">In diesem Text haben sich <b>${L.length} falsche Wörter</b> versteckt. Lies genau und tippe sie an! ${(finsOf(st.kid).some(r=>r.u===u.id&&(r.act==="train"||r.area==="f")))?"":"<br><span class='muted'>Tipp: Lies den Text vorher einmal im Lesetraining – dann findest du die Lügen leichter.</span>"}</p>
  <div class="row"><span class="chip">✅ Gefunden: ${d.found.length} von ${L.length}</span><span class="chip">❌ Daneben: ${d.wrong}</span>${all?"":`<span class="sp"></span><button class="btn sec small" onclick="st.d.rev=true;render()">💡 Auflösen</button>`}</div>`;
  h+=`<div class="textbox mt"><div class="text" id="txt">`+T.map((t,i)=>{ const x=map[i]; if(x){ if(d.found.includes(i)) return `<span class="w lfound"><s>${esc(x.lie)}</s> ${esc(x.orig)}</span>`; if(d.rev) return `<span class="w lrev"><s>${esc(x.lie)}</s> ${esc(x.orig)}</span>`; return `<span class="w ${all?"":"lt"}" data-i="${i}">${esc(x.lie)}</span>`; }
     return `<span class="w ${all?"":"lt"}" data-i="${i}">${esc(t)}</span>`; }).join(" ")+`</div></div>`;
  if(all){ const perfect=!d.rev&&d.wrong===0;
    h+=`<div class="fb ${d.rev?"info":"ok"}">${d.rev?`💡 Hier sind alle Lügen (orange). Du hast ${d.found.length} selbst gefunden.`:perfect?"🕵️ Perfekt! Alle Lügen gefunden – ohne einen einzigen Fehlklick!":`🎉 Alle Lügen gefunden! (${d.wrong} Mal daneben getippt)`}</div>
    <div class="row mt"><span class="sp"></span><button class="btn green" onclick="lieFinish()">Fertig ➜</button></div>`; }
  h+=`</div>`; return h;
}
function lieTap(i){ const d=st.d; if(d.rev||d.found.length===d.lies.length)return; const x=d.lies.find(l=>l.i===i);
  if(x){ if(!d.found.includes(i)) d.found.push(i); render(); }
  else { d.wrong++; const el=document.querySelector(`#txt .w[data-i="${i}"]`); if(el){ el.classList.add("lwrong"); setTimeout(()=>el.classList.remove("lwrong"),700);} const c=document.querySelectorAll(".chip")[document.querySelectorAll(".chip").length-1]; render(); } }
function lieFinish(){ const d=st.d, perfect=!d.rev&&d.wrong===0, sc=d.found.length;
  finishFlow("s",Math.max(1,sc+(perfect?1:0)),[`${sc} von ${d.lies.length} Lügenwörtern gefunden.`],id=>({k:id,t:Date.now(),kind:"l",u:st.unit.id,lv:st.lv,sc,mx:d.lies.length,err:d.wrong,mode:st.mode}),{perfect}); }

function trailGo(j){ stopAll(); const d=st.d, s=CT().st[d.cur], to=s.o[j][1]; const right=s.o[0][1];

function buildLies(u,lv){ const T=toks(fullText(u,lv)); const used=new Set(), seen=new Set();

function suggestLevel(k){ const lv=k.level||2, since=Date.now()-28*864e5; const R=recsOf(k.id).filter(r=>r.lv===lv&&r.t>=since);
  const F=R.filter(r=>r.kind==="f").sort((a,b)=>b.t-a.t).slice(0,5); if(F.length<3) return null;
  const wpm=Math.round(F.reduce((s,r)=>s+r.wpm,0)/F.length);
  const E=F.filter(r=>r.err!=null); const words=w=>wordCount(fullText(unit(w.u)||UNITS[0],w.lv)); const er=E.length?E.reduce((s,r)=>s+r.err/Math.max(1,words(r)),0)/E.length:null;
  const S=R.filter(r=>["s","b","l"].includes(r.kind)).slice(-6); const sc=S.reduce((s,r)=>s+r.sc,0), mx=S.reduce((s,r)=>s+r.mx,0); const pct=mx?Math.round(sc/mx*100):null;
  const why=[`Ø ${wpm} Wörter/Min.`]; if(er!=null) why.push(`${Math.round(er*100)} % Stolperwörter`); if(pct!=null) why.push(`${pct} % beim Verstehen richtig`);
  const up={1:85,2:110}[lv], down={2:55,3:75}[lv];
  if(up&&wpm>=up&&(pct==null||pct>=75)&&(er==null||er<=0.03)) return {to:lv+1,why:why.join(" · "),dir:"up"};
  if(down&&(wpm<down||(pct!=null&&pct<45)||(er!=null&&er>0.08))) return {to:lv-1,why:why.join(" · "),dir:"down"};
  return null; }

function earned(id){
  const R=recsOf(id), fins=R.filter(r=>r.kind==="fin"), has=new Set();
  if(fins.length>=1)has.add("first"); if(fins.length>=5)has.add("five"); if(fins.length>=12)has.add("twelve");
  const sDone=new Set(fins.filter(r=>r.area==="s"&&(!r.act||r.act==="strat")).map(r=>r.u));
  if(["g1","g2","g3","g4"].every(x=>sDone.has(x))||["h1","h2","h3","h4"].every(x=>sDone.has(x)))has.add("detektiv");
  if(["s1","s2","s3","s4","s5","s6","s7"].filter(x=>sDone.has(x)).length>=4)has.add("pilot");
  const f=R.filter(r=>r.kind==="f").sort((a,b)=>a.t-b.t); if(f.length>1&&Math.max(...f.slice(1).map(r=>r.wpm))>=f[0].wpm+10)has.add("speed");
  if(R.some(r=>r.kind==="s"&&r.mx>0&&r.sc===r.mx))has.add("perfect");
  if(fins.some(r=>r.mode==="tandem"))has.add("team");
  if(fins.some(r=>r.act==="race"&&r.improved))has.add("race"); if(fins.some(r=>r.act==="theater"))has.add("theater");
  if(fins.some(r=>r.act==="lie"&&r.perfect))has.add("liar"); if(fins.some(r=>r.act==="trail"))has.add("trail");
  if(((DB.recs||[]).filter(r=>r.k===id)).length>=3)has.add("rec");
  const td=trainDays(id); if(td>=5)has.add("dran"); if(td>=20)has.add("tprofi");
  if(typeof earnedExtra==="function") earnedExtra(id,has);
  return has; }

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px"><line x1="30" y1="${h-25}" x2="${w-10}" y2="${h-25}" stroke="#ccc"/><line x1="30" y1="10" x2="30" y2="${h-25}" stroke="#ccc"/><text x="2" y="18" font-size="11" fill="#777">${Math.round(mx)}</text><text x="10" y="${h-25}" font-size="11" fill="#777">0</text>
    <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#2f7fd1" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2f7fd1"/>`).join("")}<text x="30" y="${h-6}" font-size="11" fill="#777">${fmt(f[0].t).split(",")[0]}</text><text x="${w-10}" y="${h-6}" font-size="11" fill="#777" text-anchor="end">${fmt(f[f.length-1].t).split(",")[0]}</text></svg>`; }

let SAMPLE=null; try{ if(window.claude&&claude.use) claude.use("sample").then(x=>{ SAMPLE=x; if(st.screen==="teacher") render(); }).catch(()=>{}); }catch(e){}
function genBox(){ if(!SAMPLE||!st.edit) return ""; return `<div class="tip"><b>✨ Text aus Stichpunkten schreiben lassen</b><p class="muted" style="margin:0.25rem 0">Schreiben Sie in Stichpunkten, was die Klasse erlebt hat (Ort, was passiert ist, beteiligte Kinder). Claude schreibt daraus einen Lesetext in drei Stufen mit Stolperwörtern, Worterklärungen, Lügenwörtern und Fragen – alles danach hier prüfbar und änderbar.</p>
  <textarea id="gnotes" style="min-height:6.875rem" placeholder="z. B. Besuch bei der Feuerwehr Hirschau am Dienstag; Feuerwehrmann zeigt Drehleiter (30 m); Milan und Emma dürfen Schlauch halten; Atemschutz ausprobiert; Brandschutzregel: Notruf 112">${esc(st.gnotes||"")}</textarea>
  <div class="row mt"><button class="btn" ${st.genBusy?"disabled":""} onclick="genText()">${st.genBusy?"⏳ Claude schreibt … (bis zu 1 Minute)":"✨ Text schreiben lassen"}</button></div></div>`; }
async function genText(){ syncEdit(); const notes=($("#gnotes").value||"").trim(); st.gnotes=notes; if(notes.length<15){ toast("Bitte ein paar Stichpunkte mehr eintragen"); return; } st.genBusy=true; render();
  const prompt=`Du schreibst einen Lesetext für eine 3. Klasse an einer bayerischen Grundschule (Lese-App mit drei Niveaustufen). Grundlage sind NUR diese Stichpunkte der Lehrkraft:\n"""\n${notes}\n"""\nRegeln: Erfinde keine Fakten über die Stichpunkte hinaus, nur kleine erzählende Übergänge. Verwende nur Vornamen, die in den Stichpunkten stehen. Kindgerechte, korrekte deutsche Sprache, Rechtschreibung nach aktueller Regel, typografische Anführungszeichen „…“.\nStufe "leicht": 60–80 Wörter, kurze Hauptsätze. Stufe "mittel": 100–130 Wörter. Stufe "schwer": 140–180 Wörter, auch Nebensätze. Alle drei Stufen enthalten dieselben Kerninformationen.\nAntworte NUR mit einem JSON-Objekt dieser Form:\n{"titel":"…","emoji":"ein passendes Emoji","leicht":"…","mittel":"…","schwer":"…","stolperwoerter":["Feu-er-wehr", "… 5 schwierige Wörter aus dem Text mit Silbentrennung durch Bindestriche"],"erklaerungen":[{"wort":"Drehleiter","erklaerung":"kindgerechte Erklärung in einem Satz","emoji":"🚒"}],"luegen":[{"wort":"exakt so im mittleren Text vorkommendes Wort","luege":"falsches Wort mit gleicher Wortart, Form und gleichem Geschlecht, inhaltlich klar falsch"}],"fragen":[{"frage":"…","richtig":"…","falsch1":"…","falsch2":"…"}]}\nGib 6–10 Erklärungen, 5 Lügen und 4 Fragen, die in allen drei Stufen beantwortbar sind.`;
  try{ const j=await SAMPLE.json(prompt,{cache:false});
    const e=st.edit; e.title=String(j.titel||e.title||"").slice(0,60); if(j.emoji) e.icon=String(j.emoji).slice(0,8); e.text=[j.leicht,j.mittel,j.schwer].map(x=>String(x||""));
    e.words=(Array.isArray(j.stolperwoerter)?j.stolperwoerter:[]).map(String).join(", ");
    e.gloss=(Array.isArray(j.erklaerungen)?j.erklaerungen:[]).map(g=>`${g.wort} = ${g.erklaerung}${g.emoji?" "+g.emoji:""}`).join("\n");
    e.lies=(Array.isArray(j.luegen)?j.luegen:[]).map(l=>`${l.wort} = ${l.luege}`).join("\n");
    const qs=(Array.isArray(j.fragen)?j.fragen:[]).map(q=>({q:String(q.frage||""),r:String(q.richtig||""),w1:String(q.falsch1||""),w2:String(q.falsch2||"")})); while(qs.length<4) qs.push({q:"",r:"",w1:"",w2:""}); e.qs=qs;
    toast("Fertig! Bitte prüfen und dann speichern."); }
  catch(err){ toast(err&&err.code==="not_granted"?"Claude wurde nicht erlaubt":"Das hat nicht geklappt – bitte noch einmal versuchen"); }
  st.genBusy=false; render(); }

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function srAvail(){ return !!SRC; }
let SR=null;
function startSR(){ const d=st.d; d.srm={ok:[],skip:[]}; d.srFinal=""; d.srErr=null; d.srRun=true; const T=toks(fullText(st.unit,st.lv)).map(norm);
  try{ SR=new SRC(); SR.lang="de-DE"; SR.continuous=true; SR.interimResults=true;
    SR.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) d.srFinal+=" "+r[0].transcript; else interim+=" "+r[0].transcript; } srAlign(T,(d.srFinal+" "+interim)); };
    SR.onerror=e=>{ d.srErr=e.error||"error"; if(e.error==="not-allowed"||e.error==="service-not-allowed"){ d.srRun=false; render(); } };
    SR.onend=()=>{ if(d.srRun&&st.screen==="flowF"){ try{ SR.start(); }catch(x){} } };
    SR.start(); }catch(e){ d.srErr="start"; } }
function srAlign(T,text){ const d=st.d; const W=text.split(/\s+/).map(norm).filter(Boolean); let p=0; const ok=[], skip=[];
  W.forEach(w=>{ for(let j=p;j<Math.min(T.length,p+5);j++){ if(T[j]===w||(w.length>3&&T[j].startsWith(w.slice(0,4))&&Math.abs(T[j].length-w.length)<=2)){ for(let s=p;s<j;s++) skip.push(s); ok.push(j); p=j+1; break; } } });
  d.srm={ok,skip,ptr:p}; document.querySelectorAll("#txt .w").forEach(el=>{ const i=+el.dataset.i; el.classList.toggle("srok",ok.includes(i)); el.classList.toggle("srskip",skip.includes(i)); }); }
function stopSR(){ const d=st.d; d.srRun=false; try{ SR&&SR.stop(); }catch(e){} }
function srSummary(){ const d=st.d; if(!d.srOn) return ""; if(d.srErr==="not-allowed"||d.srErr==="service-not-allowed"||d.srErr==="start") return `<div class="fb info mt">🎤 Der Mitlese-Check braucht das Mikrofon. Hier ist es gesperrt – auf einer eigenen Webadresse funktioniert er.</div>`;
  if(!d.srm) return ""; const n=wordCount(fullText(st.unit,st.lv)); return `<div class="fb info mt">🎤 Die App hat ${d.srm.ok.length} von ${n} Wörtern erkannt.${d.srm.skip.length?` <span class="w srskip">Orange</span> sind Wörter, die vielleicht ausgelassen wurden.`:""} <span class="muted">Die Erkennung ist nicht perfekt – im Zweifel zählt, was der Co-Pilot gehört hat.</span></div>`; }

  const sec=(title,cards)=>cards.length?`<h2>${title}</h2><div class="grid" style="margin-bottom:1rem">${cards.join("")}</div>`:"";
  if(t==="all"||t==="story") STORIES.forEach(S=>{ h+=sec(`📖 Geschichte: ${esc(S.title)}`,UNITS.filter(u=>u.type==="story"&&(u.story||1)===S.n).map(unitCard)); });
  const facts=UNITS.filter(u=>u.type==="fact"&&(t==="all"||unitTopics(u).includes(t)));
  if(t!=="story"&&t!=="spur"&&t!=="eigen") h+=sec("🔎 Sachtexte",facts.map(unitCard));
  const trails=TRAILS.filter(T=>t==="all"||t==="spur"||TRAIL_TOPIC[T.topic]===t);
  if(t!=="story"&&t!=="eigen") h+=sec("🐾 Lesespuren",trails.map(trailCard));
  if(t==="all"||t==="eigen") h+=sec("📝 Texte von deiner Lehrkraft",C.map(unitCard));
  h+=`<p class="muted mt">Zu jedem Text kannst du danach selbst aussuchen, wie du üben möchtest.</p>`;
  return h; }
const _vActsFree=vActs;
vActs=function(){ let h=_vActsFree(); if(st.fromPick) h=h.replace(/onclick="go\('(list|hub)'\)"/,`onclick="st.area=null;go('pick')"`); return h; };
const _vDoneFree=vDone;
vDone=function(){ let h=_vDoneFree(); if(st.fromPick) h=h.split(`onclick="go('list')"`).join(`onclick="st.area=null;go('pick')"`); return h; };
const _vTrailFree=vFlowTrail;
vFlowTrail=function(){ let h=_vTrailFree(); if(st.fromPick) h=h.replace(`onclick="go('list')"`,`onclick="st.area=null;go('pick')"`); return h; };



// =====================================================================
// ===== Korrekturen Nov 2026: Namen, Zurück, Challenge, Blitz, Wörter =====
// =====================================================================

// ---------- Vorlesen einzelner Wörter (iPad-sicher) ----------
function sayWord(w){ if(!HAS_TTS) return; try{ const S=speechSynthesis; const t=String(w).replace(/-/g,"");
  const go=()=>{ try{ if(S.paused&&S.resume) S.resume(); S.speak(utter(t,0.75)); }catch(e){} };
  if(S.speaking||S.pending){ S.cancel(); setTimeout(go,150); } else go(); }catch(e){} }
function sayWordBtn(btn,w){ document.querySelectorAll(".word.say").forEach(b=>b.classList.remove("say")); if(btn){ btn.classList.add("say"); setTimeout(()=>btn.classList.remove("say"),1200); } sayWord(w); }

// ---------- Namen: immer auch eigenen Namen / Spitznamen eintragen ----------
const _vKidsN=vKids;
vKids=function(){ let h=_vKidsN(); if(h.includes('id="qn1"')) return h;
  return h+`<div class="card mt"><label class="lab" style="margin-top:0">✏️ Dein Name ist nicht dabei? Trag deinen Vornamen oder Spitznamen ein:</label>
  <div class="row"><input type="text" id="qnNew" maxlength="30" placeholder="z. B. Lenni" style="flex:1;min-width:12rem" onkeydown="if(event.key==='Enter')addOwnName()"><button class="btn green" onclick="addOwnName()">➕ ${st.mode==="tandem"?"Hinzufügen":"Los geht's"}</button></div></div>`; };
function addOwnName(){ const el=$("#qnNew"); const a=(el&&el.value||"").trim(); if(!a){ toast("Bitte einen Namen eintragen."); return; }
  if(/^gast( \d)?$/i.test(a)){ toast("Bitte einen eigenen Namen eintragen."); return; }
  const k=kidByNameOrNew(a); save();
  if(st.mode==="tandem"){ if(!st.sel.includes(k.id)&&st.sel.length<2) st.sel.push(k.id); render(); }
  else pickKid(k.id); }

// ---------- Zurück: nach freier Textwahl wieder alle Übungen zeigen ----------
const _vActsArea=vActs;
vActs=function(){ if(st.fromPick) st.area=null; return _vActsArea(); };

// ---------- 🔍 Wörter klären als eigene Übung ----------
ACTS.splice(ACTS.findIndex(a=>a.id==="strat"),0,{id:"gloss",g:"s",i:"🔍",n:"Wörter klären",d:"Schwierige Wörter aus dem Text verstehen – mit Bild, Erklärung und Quiz",ok:u=>glossOf(u).length>=2});
SCREEN_OF.gloss="flowG";
try{ ACT_INFO.gloss=["🔍","Wörter klären"]; ACT_MIN.gloss=6; }catch(e){}
function initGloss(){ const G=glossOf(st.unit); const d=st.d; d.ph="learn"; d.seen={}; d.open=null;
  const pool=shuffle(G.map((g,i)=>i)).slice(0,Math.min(5,G.length));
  d.quiz=pool.map(i=>{ const others=shuffle(G.map((g,j)=>j).filter(j=>j!==i)).slice(0,2); return {i,opts:shuffle([i,...others]),pick:null,first:null}; }); d.qi=0; }
function glossTap(i){ const d=st.d; d.open=d.open===i?null:i; d.seen[i]=1; logWord(i); render(); }
function glossSay(i){ const g=glossOf(st.unit)[i]; if(!g||!HAS_TTS) return; try{ speechSynthesis.cancel(); setTimeout(()=>speechSynthesis.speak(utter(g[0]+". "+g[2],0.85)),120);}catch(e){} }
function glossAns(o){ const d=st.d, q=d.quiz[d.qi]; if(q.pick===q.i) return; q.pick=o; if(q.first==null) q.first=(o===q.i); render(); }
function glossNextQ(){ const d=st.d; d.qi++; if(d.qi>=d.quiz.length){ const sc=d.quiz.filter(q=>q.first).length, mx=d.quiz.length;
    finishFlow("s",sc===mx?4:sc>=mx-1?3:2,[`Quiz: ${sc} von ${mx} Wörtern beim ersten Versuch richtig`],id=>({k:id,t:Date.now(),kind:"s",u:st.unit.id,lv:st.lv,sc,mx,mode:st.mode})); return; } render(); window.scrollTo(0,0); }
function vFlowG(){ const u=st.unit, d=st.d, G=glossOf(u); if(!d.ph) initGloss();
  let h=topBar(`🔍 Wörter klären: ${esc(u.title)}`,"go('acts')");
  h+=`<div class="steps"><span class="st ${d.ph==="learn"?"cur":"done"}">1. Wörter anschauen</span><span class="st ${d.ph==="quiz"?"cur":""}">2. Wörter-Quiz</span></div><div class="card">`;
  if(d.ph==="learn"){ const n=Object.keys(d.seen).length;
    h+=`<p class="instr">Diese Wörter kommen im Text vor. Tippe ein Wort an – dann siehst du, was es bedeutet. 🔊 liest dir die Erklärung vor.</p>
    <div class="gloss-grid">${G.map((g,i)=>`<button class="gtile ${d.open===i?"open":""} ${d.seen[i]?"seen":""}" onclick="glossTap(${i})"><span class="gi">${esc(g[3]||"💬")}</span><b>${esc(g[0])}</b>${d.open===i?`<span class="gx">${esc(g[2])}</span>`:""}${d.seen[i]?`<span class="gok">✓</span>`:""}</button>`).join("")}</div>
    ${d.open!=null?`<div class="row mt" style="justify-content:center"><button class="btn sec" onclick="glossSay(${d.open})">🔊 Erklärung anhören</button></div>`:""}
    <div class="row mt"><span class="muted">${n} von ${G.length} Wörtern angeschaut</span><span class="sp"></span><button class="btn green" ${n?"":"disabled"} onclick="st.d.ph='quiz';st.d.qi=0;render();window.scrollTo(0,0)">Weiter: Quiz ➜</button></div>`;
  } else { const q=d.quiz[d.qi], g=G[q.i];
    h+=`<p class="muted">Frage ${d.qi+1} von ${d.quiz.length}</p><p class="q">Welches Wort passt zu dieser Erklärung?</p>
    <div class="tip" style="font-size:1.375rem">${esc(g[2])}</div>
    ${q.opts.map(o=>{ const G2=G[o]; const cls=q.pick==null?"":(o===q.i&&q.pick===q.i?"ok":(o===q.pick?"bad":"")); return `<button class="opt ${cls}" onclick="glossAns(${o})">${esc(G2[0])}</button>`; }).join("")}
    ${q.pick!=null?(q.pick===q.i?`<div class="fb ok">${esc(g[3]||"")} Richtig! <b>${esc(g[0])}</b></div>`:`<div class="fb bad">Noch nicht. Versuch es nochmal!</div>`):""}
    <div class="row mt"><button class="btn sec" onclick="st.d.ph='learn';render()">◀ Wörter</button><span class="sp"></span><button class="btn green" ${q.pick===q.i?"":"disabled"} onclick="glossNextQ()">${d.qi+1<d.quiz.length?"Nächste Frage ➜":"Fertig ➜"}</button></div>`; }
  return h+`</div>`; }

// ---------- Lesetraining Schritt 1: Stolperwörter + Blitzlesen (begrenzt) ----------
const _vFlowF5=vFlowF;
vFlowF=function(){ if(st.step!==0) return _vFlowF5();
  const u=st.unit, d=st.d; let h=topBar(`${esc(u.icon||"📄")} ${esc(u.title)}`,"go('acts')");
  h+=`<div class="steps">${F_STEPS.map((n,i)=>`<span class="st ${i===0?"cur":""}">${i+1}. ${n}</span>`).join("")}<span class="st">${LV[st.lv].i} ${LV[st.lv].n}</span></div>`;
  if(st.mode==="class") h+=`<div class="tip"><b>Tipp für die Lehrkraft:</b> ${TIPS_F[0]}</div>`;
  h+=`<div class="card">`;
  const W=u.words||[];
  if(d.bq==null){
    h+=`<p class="instr">Diese Wörter kommen im Text vor. Tippe ein Wort an und hör es dir an 🔊. Lies es dann selbst laut – Silbe für Silbe.</p>
    <div class="words">${W.map((w,i)=>`<button class="word" onclick="sayWordBtn(this,st.unit.words[${i}])">${st.daz?stolperDaz(w):""}${syl(w)} <span class="spk">🔊</span></button>`).join("")}</div>
    <div class="row mt"><button class="btn orange" onclick="blitzStart()">⚡ Blitzlesen: ${W.length} Wörter</button><span class="sp"></span><button class="btn green" onclick="fNext()">Weiter: Hören ➜</button></div>`;
  } else if(d.bq.length&&d.bk<d.bq.length){ const i=d.bq[d.bk], w=W[i];
    h+=`<p class="muted" style="text-align:center">⚡ Blitzlesen · Wort ${d.bk+1} von ${d.bq.length}</p>
    <div class="bdots">${d.bq.map((x,k)=>`<span class="${k<d.bk?"done":k===d.bk?"cur":""}"></span>`).join("")}</div>
    <div class="blitz" id="blitzw">${d.bs?syl(w):"❓"}</div><p class="instr" style="text-align:center" id="blitzi">${d.bs?"Lies das Wort schnell!":"Welches Wort war das? Sag es laut!"}</p>
    <div class="row" style="justify-content:center"><button class="btn sec" onclick="blitzShow()">👀 Nochmal zeigen</button><button class="btn sec" onclick="sayWordBtn(null,st.unit.words[${i}])">🔊 Anhören</button><button class="btn" onclick="blitzNext()">${d.bk+1<d.bq.length?"Nächstes Wort ➜":"Fertig ✓"}</button></div>`;
  } else {
    h+=`<div class="fb ok" style="text-align:center">⚡ Super! Du hast alle ${W.length} Wörter geblitzt.</div>
    <div class="row mt"><button class="btn sec" onclick="blitzStart()">🔁 Nochmal blitzen</button><button class="btn sec" onclick="st.d.bq=null;render()">◀ Wörter</button><span class="sp"></span><button class="btn green" onclick="fNext()">Weiter: Hören ➜</button></div>`;
  }
  return h+`</div>`; };
function blitzStart(){ stopAll(); const d=st.d; d.bq=shuffle((st.unit.words||[]).map((w,i)=>i)); d.bk=0; blitzShow(); }
function blitzShow(){ const d=st.d; d.bs=true; render(); clearTimers(); const my=d.bk;
  TIMERS.push(setTimeout(()=>{ if(st.screen==="flowF"&&st.step===0&&st.d.bk===my&&st.d.bq){ st.d.bs=false; const b=$("#blitzw"), t=$("#blitzi"); if(b) b.textContent="❓"; if(t) t.textContent="Welches Wort war das? Sag es laut!"; } }, st.mode==="class"?1500:1000)); }
function blitzNext(){ const d=st.d; d.bk++; if(d.bk<d.bq.length) blitzShow(); else { clearTimers(); render(); } }
// alte Blitz-Funktion: keine Endlosschleife mehr
function blitz(){ blitzNext(); }

// ---------- 🏁 Lese-Challenge: Text zuerst, Auto fährt mit, Fertig-Knopf kurz gesperrt ----------
function minReadSec(){ const w=wordCount(fullText(st.unit,st.lv)); return Math.max(5,Math.min(15,Math.round(w/300*60))); }
const _vFlowR5=vFlowR;
vFlowR=function(){ let h=_vFlowR5();
  // Text vor die Steuerung holen: Steuerung soll unten (sichtbar) bleiben
  const tb=h.lastIndexOf('<div class="textbox mt">'); if(tb>0){ const end=h.lastIndexOf('</div></div></div>'); const text=h.slice(tb,end+12); h=h.slice(0,tb)+h.slice(end+12);
    const tr=h.indexOf('<div class="track">'); if(tr>0) h=h.slice(0,tr)+text.replace('textbox mt','textbox')+`<div class="mt"></div>`+h.slice(tr); }
  return h; };
const _raceStart5=raceStart;
raceStart=function(){ _raceStart5(); const d=st.d, my=d.round; const g=d.round>0?d.times[d.round-1]:bestTime(st.unit.id,st.lv); const est=g||Math.round(wordCount(fullText(st.unit,st.lv))/90*60);
  TIMERS.push(setInterval(()=>{ const me=$("#me"); if(!me||st.d.round!==my||st.d.r!=="run") return; const f=Math.min(0.92,(Date.now()-d.t0)/1000/est); me.style.left=`calc((100% - 2.875rem) * ${f.toFixed(3)})`; },250)); };
const _raceStop5=raceStop;
raceStop=function(){ const d=st.d; if(d.t0&&Date.now()-d.t0<minReadSec()*1000){ toast("Lies zuerst den ganzen Text! 📖"); return; } _raceStop5(); };
const _srStop5=srStop;
srStop=function(){ const d=st.d; if(d.t0&&Date.now()-d.t0<minReadSec()*1000){ toast("Lies zuerst den ganzen Text! 📖"); return; } _srStop5(); };
function lockStopButtons(){ const d=st.d; if(!d||d.r!=="run"||!d.t0) return; const btns=[...document.querySelectorAll('button[onclick^="raceStop"],button[onclick^="srStop"]')]; if(!btns.length) return;
  const lab=btns.map(b=>b.innerHTML);
  const tick=()=>{ const left=Math.ceil((minReadSec()*1000-(Date.now()-d.t0))/1000); btns.forEach((b,k)=>{ if(!document.body.contains(b)) return; if(left>0){ b.disabled=true; b.style.opacity=".55"; b.innerHTML=`⏳ Lies weiter … (${left} s)`; } else { b.disabled=false; b.style.opacity=""; b.innerHTML=lab[k]; } }); return left>0; };
  if(tick()){ const iv=setInterval(()=>{ if(!tick()) clearInterval(iv); },500); TIMERS.push(iv); } }

// ---------- iPad first: Weiter-Knöpfe ohne Scrollen ----------
function stickyActions(){ if(!/^flow/.test(st.screen)) return; const card=document.querySelector("#app .card:last-of-type")||document.querySelector("#app .card"); if(!card) return;
  const rows=[...card.querySelectorAll(":scope > .row")].filter(r=>r.querySelector(".btn.green,.btn.red,.btn.orange,.btn:not(.sec)"));
  const last=rows[rows.length-1]; if(!last) return;
  const tbs=[...card.querySelectorAll(":scope > .textbox")]; const tb=tbs[tbs.length-1];
  if(tb&&(last.compareDocumentPosition(tb)&Node.DOCUMENT_POSITION_FOLLOWING)){ tb.after(last); }
  last.classList.add("stickybar"); }
const _render5=render;
render=function(){ _render5(); try{ stickyActions(); lockStopButtons(); }catch(e){} };

render();

</script>
