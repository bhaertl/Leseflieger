<title>Leseflieger – Lesetraining</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#e3f1fb;--ink:#1f2d3d;--muted:#5b6b7b;--blue:#2f7fd1;--blue-d:#1f5fa3;--blue-l:#eaf3fd;--green:#2e9e5b;--green-d:#1f7442;--green-l:#dff3e6;--red:#d64545;--red-l:#fbe3e3;--yellow:#ffe27a;--yellow-l:#fff6d1;--orange:#f39b2f;--line:#d9e4ee;--purple:#7a5cc7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Andika',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0,#f7fbfe 26.25rem);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;font-size:inherit}
button{touch-action:manipulation;cursor:pointer;border:none;color:inherit;background:none}
h1,h2,h3,.fred{font-family:'Fredoka','Andika',sans-serif;font-weight:600}
h2{font-size:1.625rem;margin:0.25rem 0 0.75rem}
h3{font-size:1.3125rem;margin:0.25rem 0 0.625rem}
#app{max-width:67.5rem;margin:0 auto;padding:0.875rem 1.125rem 3.75rem}
.top{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.875rem;min-height:3.375rem;flex-wrap:wrap}
.top h1{font-size:1.5625rem;margin:0;flex:1;min-width:10rem}
.back{background:#fff;border:2px solid var(--line);border-radius:0.875rem;padding:0.625rem 1rem;font-size:1.125rem;font-weight:700}
.chip{background:#fff;border-radius:62.4375rem;padding:0.5rem 0.875rem;border:2px solid var(--line);font-size:1.0625rem;display:inline-flex;gap:0.375rem;align-items:center;white-space:nowrap}
.card{background:#fff;border-radius:1.375rem;padding:1.375rem;box-shadow:0 2px 0 var(--line),0 0.375rem 1.125rem rgba(30,80,130,.07);margin-bottom:1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:0.375rem;text-align:left;background:#fff;border-radius:1.375rem;padding:1.375rem;font-size:1.1875rem;border:3px solid transparent;box-shadow:0 3px 0 var(--line),0 0.5rem 1.25rem rgba(30,80,130,.08);min-height:9.375rem}
.big:active,.btn:active,.opt:active,.word:active{transform:translateY(2px)}
.big .ic{font-size:2.875rem;line-height:1}
.big b{font-family:Fredoka,Andika,system-ui,sans-serif;font-size:1.5rem;font-weight:600}
.big small{color:var(--muted);font-size:1rem;line-height:1.35}
.big.sel{border-color:var(--blue);background:var(--blue-l)}
.btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--blue);color:#fff;border-radius:1rem;padding:0.8125rem 1.375rem;font-size:1.25rem;font-weight:700;box-shadow:0 3px 0 var(--blue-d);min-height:3.5rem}
.btn.sec{background:#fff;color:var(--blue-d);border:2px solid var(--blue);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 3px 0 var(--green-d)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 #b86f17}
.btn.red{background:var(--red);box-shadow:0 3px 0 #9c2f2f}
.btn.small{min-height:2.75rem;padding:0.5rem 0.875rem;font-size:1.0625rem}
.btn:disabled{opacity:.4}
.row{display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mt{margin-top:1rem}
.muted{color:var(--muted)}
.instr{font-size:1.3125rem;line-height:1.5;margin:0 0 0.875rem}
.hero{display:flex;align-items:center;gap:1.125rem;margin:0.625rem 0 1.375rem}
.hero h1{font-size:2.75rem;margin:0;color:var(--blue-d)}
.hero p{margin:0.25rem 0 0;font-size:1.1875rem;color:var(--muted)}
.steps{display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:0.875rem}
.st{padding:0.5rem 0.75rem;border-radius:0.75rem;background:#fff;border:2px solid var(--line);font-size:0.9375rem;color:var(--muted)}
.st.cur{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.st.done{background:var(--green-l);border-color:#a6dcb9;color:var(--green-d)}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:1rem;padding:0.25rem;gap:0.25rem;flex-wrap:wrap}
.seg button{padding:0.5625rem 0.875rem;border-radius:0.75rem;font-size:1.0625rem;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
/* Lesetext */
.text{font-size:calc(1.625rem * var(--rs,1));line-height:calc(1.95 * var(--lh,1));margin:0.375rem 0}
.text,.ltext,.blitz,.tsent{font-family:var(--rf,'Andika'),'Andika',sans-serif;letter-spacing:var(--ls,.01em)}
.lv1 .text{font-size:calc(1.875rem * var(--rs,1));line-height:calc(2.1 * var(--lh,1))}
.cls .text{font-size:calc(2.375rem * var(--rs,1));line-height:calc(1.8 * var(--lh,1))}
.cls .instr,.cls .opt{font-size:1.625rem}
.w{border-radius:0.5rem;padding:1px 2px;transition:background .12s;white-space:nowrap}
.w.on{background:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.w.err{background:var(--red-l);color:var(--red);text-decoration:underline wavy var(--red)}
.w.tap{cursor:pointer}
.w.sig{background:#d3e9ff;color:var(--blue-d);font-weight:700}
.sent{border-radius:0.5rem;padding:3px 2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent.mk{background:var(--yellow)}

"Johanna und Milan sind in den Herbstferien bei Oma Rosi. Oma wohnt in einem kleinen Haus mit einem großen Garten. Im Garten liegen schon viele bunte Blätter. Jeden Abend stellt Oma einen Napf mit Futter auf die Terrasse. Das Futter ist für Kater Moritz. Am Morgen ist der Napf immer leer. Aber Moritz schläft doch die ganze Nacht im Haus! „Wer frisst nur das Futter?“, fragt Johanna neugierig. Milan kratzt sich am Kopf. „Das ist ein echtes Rätsel“, sagt er.",
"Johanna und ihr Cousin Milan verbringen die Herbstferien bei Oma Rosi. Oma wohnt am Rand des Dorfes in einem kleinen Haus mit einem großen Garten. Es ist kühl geworden, und auf dem Rasen liegen viele bunte Blätter. Jeden Abend stellt Oma einen Napf mit Katzenfutter auf die Terrasse. Das Futter ist für Kater Moritz, der gerne draußen frisst. Doch seit ein paar Tagen ist etwas seltsam. Am Morgen ist der Napf immer leer, obwohl Moritz die ganze Nacht schnarchend auf dem Sofa liegt. „Wer frisst denn dann das Futter?“, fragt Johanna neugierig. Milan schiebt seine Brille zurecht und denkt nach. „Das ist ein echtes Rätsel“, sagt er. „Und Rätsel muss man lösen.“",
"Johanna und ihr Cousin Milan freuen sich schon seit Wochen auf die Herbstferien bei Oma Rosi. Oma wohnt am Rand des Dorfes in einem kleinen, gelben Haus. Dahinter liegt ein großer Garten mit einem alten Apfelbaum, einer dichten Hecke und einem Gemüsebeet. Jetzt im Herbst ist es morgens schon kühl, und der Wind weht bunte Blätter über den Rasen. Jeden Abend stellt Oma einen Napf mit Katzenfutter auf die Terrasse, denn Kater Moritz frisst am liebsten draußen. Doch seit einigen Tagen geschieht etwas Merkwürdiges. Jeden Morgen ist der Napf blitzblank leer, obwohl Moritz die ganze Nacht schnarchend auf dem Sofa verbringt. „Wer frisst denn dann das Futter?“, fragt Johanna neugierig und betrachtet den leeren Napf. Milan schiebt seine Brille zurecht und runzelt die Stirn. „Das ist ein echtes Rätsel“, sagt er nachdenklich. „Und Rätsel sind dazu da, gelöst zu werden.“"

{id:"g2", type:"story", nr:2, title:"Spuren im Mehl", icon:"🐾",
 words:["Spu-ren","Be-wei-se","Ze-hen","Lu-pe","He-cke"],
 text:[
"Johanna hat eine Idee. Sie holt Mehl aus Omas Küche. Am Abend streut sie das Mehl rund um den Napf. Am nächsten Morgen ist es kalt. Auf dem Gras glitzert der Tau. Die Kinder laufen schnell auf die Terrasse. Der Napf ist wieder leer. Aber im Mehl sind kleine Spuren! Milan schaut ganz genau hin. Jede Spur hat fünf Zehen. „Katzen haben nur vier Zehen“, sagt Milan. Die Spuren führen bis zur Hecke.",
"Beim Frühstück hat Johanna eine Idee. „Wir brauchen Beweise“, sagt sie und holt eine Tüte Mehl aus Omas Küche. Am Abend streut sie das Mehl in einem großen Kreis rund um den Futternapf. Am nächsten Morgen ist es kalt und neblig. Auf dem Gras glitzert der Tau. Johanna und Milan rennen im Schlafanzug auf die Terrasse. Der Napf ist wieder leer, doch im weißen Mehl sind viele kleine Spuren zu sehen. Milan holt seine Lupe und schaut ganz genau hin. „Jede Spur hat fünf Zehen“, sagt er. „Bei Katzen sieht man nur vier Zehen. Moritz war es also nicht.“ Die Spuren führen quer über die Terrasse bis zur dichten Hecke.",
"Beim Frühstück rührt Johanna lange in ihrem Kakao. Plötzlich springt sie auf. „Ich habe eine Idee! Wir brauchen Beweise, so wie richtige Detektive.“ Sie holt eine Tüte Mehl aus Omas Vorratsschrank. Oma Rosi lacht: „Aber verbraucht nicht alles, ich will noch einen Kuchen backen.“ Am Abend streut Johanna das Mehl vorsichtig in einem großen Kreis rund um den Futternapf. Am nächsten Morgen ist es kalt und neblig, und auf dem Gras glitzert der Tau wie tausend kleine Perlen. Johanna und Milan rennen noch im Schlafanzug auf die Terrasse. Der Napf ist wieder leer, doch im weißen Mehl sind viele winzige Abdrücke zu erkennen. Milan holt seine Lupe aus der Tasche und betrachtet die Spuren ganz genau. „Jeder Abdruck hat fünf Zehen“, stellt er fest. „Bei Katzen sieht man nur vier Zehen. Moritz war es also eindeutig nicht.“ Die Spuren führen in einer Zickzacklinie quer über die Terrasse bis unter die dichte Hecke."
 ],

{id:"g3", type:"story", nr:3, title:"Die Nachtwache", icon:"🔦",
 words:["Ta-schen-lam-pe","Wohn-zim-mer","Ra-scheln","Schmat-zen","Schat-ten"],
 text:[
"Heute wollen Johanna und Milan den Dieb sehen. Sie setzen sich ans Fenster im Wohnzimmer. Draußen ist es dunkel. Nur der Mond scheint. Johanna hält eine Taschenlampe in der Hand. Oma bringt warmen Kakao. Lange passiert nichts. Milan gähnt. Er ist sehr müde. Plötzlich hören die Kinder ein Rascheln und ein Schmatzen. Johanna knipst die Lampe an. Ein kleiner, runder Schatten huscht in die Hecke.",
"„Heute Nacht erwischen wir den Dieb“, flüstert Johanna. Oma erlaubt den Kindern, bis zehn Uhr aufzubleiben. Johanna und Milan setzen sich mit Decken ans Fenster im Wohnzimmer. Draußen ist es dunkel und still. Nur der Mond scheint auf die Terrasse. Johanna hält die Taschenlampe fest in der Hand. Oma bringt jedem eine Tasse warmen Kakao. Lange passiert gar nichts. Milan gähnt, und seine Augen werden immer kleiner. Doch plötzlich hören die Kinder ein leises Rascheln im Laub. Dann folgt ein lautes Schmatzen. Johanna knipst mutig die Taschenlampe an. Ein kleiner, runder Schatten huscht blitzschnell davon und verschwindet in der Hecke.",
"„Heute Nacht erwischen wir den Futterdieb auf frischer Tat“, flüstert Johanna entschlossen. Oma Rosi erlaubt den beiden ausnahmsweise, bis zehn Uhr aufzubleiben. Eingekuschelt in dicke Decken setzen sich Johanna und Milan ans große Fenster im Wohnzimmer. Draußen ist es dunkel und ganz still, nur der Mond wirft ein silbernes Licht auf die Terrasse. Johanna hält die Taschenlampe fest umklammert. Oma bringt jedem eine Tasse heißen Kakao und setzt sich leise dazu. Minute um Minute vergeht, ohne dass etwas passiert. Milan gähnt herzhaft, und seine Augen fallen immer wieder zu. Doch plötzlich raschelt es im Laub unter dem Apfelbaum. Kurz darauf ist ein lautes, zufriedenes Schmatzen zu hören. Johanna nimmt all ihren Mut zusammen und knipst die Taschenlampe an. Im Lichtkegel huscht ein kleiner, runder Schatten über die Steine und verschwindet blitzschnell in der Hecke."
 ],

{id:"g4", type:"story", nr:4, title:"Der Gast mit den Stacheln", icon:"🦔",
 words:["Sta-cheln","I-gel","Win-ter-schlaf","Fett-pols-ter","Schäl-chen"],
 text:[
"Am nächsten Abend sind die Kinder ganz leise. Sie lassen nur ein kleines Licht an. Da kommt der Dieb aus der Hecke. Er hat eine spitze Nase und viele Stacheln. Es ist ein Igel! Er ist sehr hungrig und frisst den Napf leer. Oma erklärt: „Im Herbst muss ein Igel viel fressen. Dann hat er genug Kraft für den Winterschlaf.“ Milch darf man Igeln nicht geben, nur Wasser in einem Schälchen. Zusammen bauen sie aus Laub und Ästen ein Winterhaus. Die Kinder nennen den Igel Stupsi.",
"Am nächsten Abend sind Johanna und Milan mucksmäuschenstill. Sie lassen nur eine kleine Lampe brennen. Da schiebt sich ein spitzes Näschen aus der Hecke. Langsam trippelt ein Tier mit vielen Stacheln auf den Napf zu. „Ein Igel!“, flüstert Milan begeistert. Der hungrige Igel schmatzt so laut, dass die Kinder kichern müssen. Oma erklärt: „Im Herbst muss ein Igel sehr viel fressen. So bekommt er ein dickes Fettpolster und hat genug Kraft für den Winterschlaf.“ Dann sagt sie noch: „Milch dürfen wir Igeln nie geben, davon bekommen sie Bauchweh. Ein Schälchen Wasser ist besser.“ Am Samstag bauen die drei aus Laub und Ästen ein gemütliches Winterhaus. Die Kinder taufen ihren Gast Stupsi.",
"Am nächsten Abend verhalten sich Johanna und Milan mucksmäuschenstill. Diesmal lassen sie nur eine kleine Lampe auf der Terrasse brennen. Nach einer Weile schiebt sich ein spitzes, schnüffelndes Näschen aus der Hecke. Langsam trippelt ein rundes Tier mit unzähligen Stacheln auf den Napf zu. „Ein Igel!“, flüstert Milan begeistert. Der hungrige Gast schmatzt so laut, dass sich die Kinder die Hand vor den Mund halten müssen, um nicht laut loszulachen. Oma Rosi erklärt: „Im Herbst muss ein Igel sehr viel fressen. So legt er sich ein dickes Fettpolster an und hat genug Kraft für den langen Winterschlaf.“ Dann fügt sie hinzu: „Milch dürfen wir Igeln niemals geben, davon bekommen sie Bauchschmerzen. Ein flaches Schälchen mit Wasser ist viel besser.“ Am Samstag schichten die drei in einer ruhigen Gartenecke Laub und Äste zu einem gemütlichen Winterhaus auf. Zum Abschluss taufen die Kinder ihren stacheligen Gast auf den Namen Stupsi."
 ],

 text:[
  ["Der Igel ist ein kleines Tier.","!Er hat sehr viele Stacheln auf dem Rücken.","Bei Gefahr rollt er sich zu einer Kugel.","!Der Igel frisst gerne Käfer, Würmer und Schnecken.","!Am Tag schläft er.","!In der Nacht ist er wach und sucht Futter.","Im Herbst frisst er sich dick.","!Im Winter hält er Winterschlaf in einem Haufen aus Laub."],
  ["Der Igel lebt in Gärten, Hecken und am Waldrand.","!Auf seinem Rücken trägt er etwa 7000 spitze Stacheln.","Bei Gefahr rollt er sich zu einer stacheligen Kugel zusammen.","?Sein Bauch hat keine Stacheln, sondern Fell.","!Der Igel frisst am liebsten Käfer, Regenwürmer und Schnecken.","!Tagsüber schläft er in einem Versteck.","!Erst in der Dämmerung und in der Nacht geht er auf Futtersuche.","Dabei hilft ihm seine gute Nase.","Im Herbst frisst er sich ein dickes Fettpolster an.","!Von November bis März hält er Winterschlaf in einem Nest aus Laub."],
  ["Igel gibt es schon seit vielen Millionen Jahren.","Man findet sie in Gärten, Parks, Hecken und am Waldrand.","!Ihr Rücken ist mit etwa 7000 spitzen Stacheln bedeckt, die zwei bis drei Zentimeter lang sind.","Bei Gefahr rollt sich ein Igel blitzschnell zu einer stacheligen Kugel zusammen.","?Gesicht und Bauch sind dagegen mit Fell bedeckt.","!Der Igel ist ein Insektenfresser: Er frisst vor allem Käfer, Regenwürmer, Raupen und Schnecken.","!Tagsüber schläft er gut versteckt unter Büschen oder in Laubhaufen.","!Erst in der Dämmerung wird er munter und geht die ganze Nacht auf Futtersuche.","Dabei verlässt er sich auf seine feine Nase und sein gutes Gehör.","Im Herbst frisst er sich ein Fettpolster an.","!Von etwa November bis März hält er dann Winterschlaf in einem gut gepolsterten Nest aus Laub.","?Sein Herz schlägt in dieser Zeit viel langsamer, und sein Körper wird ganz kühl."]

{id:"s2", type:"fact", vis:"netz", title:"Der Fuchs", icon:"🦊",

 signal:["fell","schwanz","ohren","frisst","allesfresser","bau","wohnt","junge","welpen","füchsin"],
 text:[
  ["Der Fuchs lebt im Wald und auf Feldern.","!Er hat ein rotbraunes Fell und einen langen, buschigen Schwanz.","Seine Ohren sind spitz.","Er kann sehr gut hören und riechen.","!Der Fuchs frisst Mäuse, Würmer und auch Beeren.","!Er wohnt in einer Höhle unter der Erde.","?Diese Höhle heißt Bau.","?Im Frühling bekommt die Füchsin Junge.","!Die Jungen heißen Welpen."],
  ["Der Rotfuchs lebt in Wäldern, auf Feldern und manchmal sogar in Städten.","!Sein Fell ist rotbraun, und er hat einen langen, buschigen Schwanz.","Seine spitzen Ohren hören jedes Rascheln.","Auch seine Nase ist sehr fein.","!Der Fuchs ist ein Allesfresser: Er frisst Mäuse, Regenwürmer, Käfer und im Sommer auch Beeren und Obst.","!Er wohnt in einem Bau unter der Erde, der mehrere Gänge und Ausgänge hat.","Oft gräbt er den Bau nicht selbst, sondern zieht in einen alten Dachsbau ein.","?Im Frühling bringt die Füchsin im Bau vier bis sechs Junge zur Welt.","!Die kleinen Welpen sind zuerst blind und trinken Milch."],
  ["Der Rotfuchs ist das häufigste wilde Raubtier in Deutschland.","Er lebt in Wäldern, auf Wiesen und Feldern und inzwischen sogar mitten in großen Städten.","!Sein Fell ist rotbraun, Brust und Kehle sind weiß, und seinen langen, buschigen Schwanz nennen Jäger Lunte.","Mit seinen großen, spitzen Ohren hört er sogar, wie eine Maus unter der Erde raschelt.","Auch seine Nase ist ausgezeichnet.","!Der Fuchs ist ein Allesfresser: Am liebsten jagt er Mäuse, er frisst aber auch Regenwürmer, Käfer, Vogeleier sowie Beeren und Obst.","!Er wohnt in einem Bau unter der Erde, der aus mehreren Gängen, Kammern und Ausgängen besteht.","Häufig zieht er in einen alten Dachsbau ein, statt selbst zu graben.","?Im Frühling bringt die Füchsin dort meist vier bis sechs Junge zur Welt.","!Die Welpen sind zunächst blind und trinken einige Wochen lang Milch, bevor sie zum ersten Mal den Bau verlassen."]
 ],

{id:"s3", type:"fact", vis:"kette", title:"Vom Korn zum Brot", icon:"🍞",
 words:["Ge-trei-de","Mäh-dre-scher","Müh-le","Bä-cker","Kör-ner"],
 leit:["Wie entsteht Brot?","Was passiert nacheinander?"],
 signal:["zuerst","dann","danach","anschließend","schluss","sommer","hochsommer","dort"],
 text:[
  ["Brot wird aus Getreide gemacht.","!Zuerst sät der Bauer die Körner auf dem Feld.","!Dann wachsen die Pflanzen.","Sie brauchen Sonne und Regen.","!Im Sommer erntet der Bauer das Getreide mit einem Mähdrescher.","?Danach bringt er die Körner in die Mühle.","!Dort werden die Körner zu Mehl gemahlen.","!Zum Schluss backt der Bäcker aus dem Mehl ein leckeres Brot."],
  ["Jeden Tag essen wir Brot.","Doch wie entsteht es eigentlich?","!Zuerst pflügt der Bauer sein Feld und sät die Getreidekörner in die Erde.","!Dann keimen die Körner, und mit Sonne und Regen wachsen daraus hohe Halme mit Ähren.","!Im Sommer sind die Ähren reif und goldgelb, und der Bauer erntet sie mit einem Mähdrescher.","?Diese große Maschine trennt die Körner vom Stroh.","?Danach fährt der Bauer die Körner zur Mühle.","!Dort mahlen große Walzen die Körner zu feinem Mehl.","!Zum Schluss mischt der Bäcker Mehl, Wasser, Salz und Hefe zu einem Teig, knetet ihn und backt daraus duftendes Brot."],
  ["Brot gehört zu unseren wichtigsten Lebensmitteln.","Bis es auf dem Frühstückstisch liegt, ist es allerdings ein weiter Weg.","!Zuerst pflügt der Bauer das Feld und sät die Körner von Weizen, Roggen oder Dinkel in die lockere Erde.","!Dann beginnen die Körner zu keimen, und mithilfe von Sonne, Regen und Nährstoffen wachsen daraus kräftige Halme mit Ähren.","!Im Hochsommer sind die Ähren reif und goldgelb, sodass der Bauer sie mit einem Mähdrescher ernten kann.","?Diese riesige Maschine schneidet die Halme ab und trennt die Körner gleichzeitig vom Stroh.","?Anschließend transportiert der Bauer die Körner zur Mühle.","!Dort werden sie gereinigt und zwischen schweren Walzen zu feinem Mehl gemahlen.","!Zum Schluss verarbeitet der Bäcker das Mehl mit Wasser, Salz und Hefe oder Sauerteig zu einem Teig, knetet ihn kräftig, lässt ihn gehen und backt ihn im heißen Ofen zu duftendem Brot."]

 text:[
  ["Die Eiche ist ein großer Baum.","Ihre Früchte heißen Eicheln.","!Im Herbst fallen die Eicheln auf den Boden.","?Dann kommt ein Vogel, der Eichelhäher.","!Er versteckt die Eicheln in der Erde.","Manche Eicheln vergisst er.","!Im Frühling wächst aus der Eichel eine Wurzel nach unten und ein kleiner Trieb nach oben.","!Danach wird daraus ein kleiner Baum.","?Er wächst sehr langsam.","!Nach vielen Jahren ist er eine große Eiche mit eigenen Eicheln."],
  ["Die Eiche ist einer der bekanntesten Bäume in unseren Wäldern.","Ihre Früchte heißen Eicheln.","!Im Herbst sind die Eicheln reif und fallen auf den Waldboden.","?Dann kommt der Eichelhäher, ein bunter Vogel.","!Er sammelt die Eicheln und vergräbt sie als Wintervorrat in der Erde.","Viele Verstecke findet er nicht wieder.","!Im Frühling keimt eine vergessene Eichel: Eine Wurzel wächst nach unten, ein kleiner Spross nach oben.","!Danach entwickelt sich daraus ein winziges Bäumchen mit den ersten Blättern.","?Es wächst nur langsam, Jahr für Jahr ein Stückchen.","!Erst nach vielen Jahrzehnten ist es eine große Eiche, die selbst Eicheln trägt."],
  ["Die Eiche zählt zu den bekanntesten Bäumen in Deutschland und kann über 500 Jahre alt werden.","Ihre Früchte, die Eicheln, sitzen in kleinen Bechern.","!Im Herbst sind die Eicheln reif, lösen sich aus ihren Bechern und fallen auf den Waldboden.","?Nun beginnt die Zeit des Eichelhähers, eines bunten Rabenvogels.","!Er sammelt Tausende Eicheln und vergräbt sie als Wintervorrat an vielen verschiedenen Stellen in der Erde.","Einen Teil dieser Verstecke findet er nicht wieder.","!Im Frühling keimt eine vergessene Eichel: Zuerst schiebt sie eine Wurzel tief in den Boden, anschließend wächst ein zarter Spross nach oben ans Licht.","!Danach entwickelt sich daraus ein kleines Bäumchen mit den typischen gelappten Blättern.","?In den ersten Jahren wächst es sehr langsam und muss sich gegen Rehe und Mäuse behaupten, die gerne an jungen Pflanzen knabbern.","!Erst nach etwa 40 bis 60 Jahren ist aus dem Bäumchen eine stattliche Eiche geworden, die selbst Eicheln trägt."]
 ],

{id:"s5", type:"fact", vis:"netz", title:"Die Stockwerke des Waldes", icon:"🌲",

  ["Ein Wald ist aufgebaut wie ein Haus mit mehreren Stockwerken.","In jedem Stockwerk wachsen andere Pflanzen und leben andere Tiere.","!Das unterste Stockwerk ist die Moosschicht: Hier wachsen Moose und Pilze, und Käfer, Ameisen und Schnecken sind unterwegs.","!Darüber liegt die Krautschicht mit Gräsern, Farnen und Waldblumen, die etwa einen Meter hoch werden.","!In der Strauchschicht wachsen Sträucher wie Holunder und Haselnuss, aber auch junge Bäume.","?Viele Vögel bauen hier im dichten Gebüsch ihre Nester.","!Das höchste Stockwerk ist die Baumschicht mit großen Bäumen wie Buchen, Eichen und Fichten.","?In den Baumkronen leben Eichhörnchen, Spechte und Eulen."],
  ["Wer durch einen Wald spaziert, kann ihn sich wie ein Hochhaus mit mehreren Stockwerken vorstellen.","In jedem Stockwerk herrschen andere Bedingungen, deshalb wachsen dort unterschiedliche Pflanzen und leben verschiedene Tiere.","Unter der Erde liegt die Wurzelschicht, in der Regenwürmer und Mäuse wohnen.","!Direkt auf dem Waldboden folgt die Moosschicht: Moose, Pilze und Flechten bedecken den Boden, und Käfer, Ameisen und Schnecken suchen hier Nahrung.","!Darüber erhebt sich die Krautschicht mit Gräsern, Farnen und Waldblumen, die etwa einen Meter hoch wachsen.","!In der Strauchschicht, die bis etwa fünf Meter hoch reicht, wachsen Sträucher wie Holunder und Haselnuss sowie junge Bäume.","?Viele Singvögel bauen im dichten Gebüsch ihre Nester, weil sie dort gut geschützt sind.","!Ganz oben befindet sich die Baumschicht mit mächtigen Bäumen wie Buchen, Eichen und Fichten, die über 30 Meter hoch werden können.","?In den Baumkronen leben Eichhörnchen, Spechte und Eulen."]

{id:"s6", type:"fact", vis:"kette", title:"Der Kreislauf des Wassers", icon:"💧",
 words:["Kreis-lauf","ver-duns-tet","Was-ser-dampf","Tröpf-chen","Wol-ken"],
 leit:["Wie reist das Wasser?","Was passiert nacheinander?"],
 signal:["zuerst","dann","danach","wenn","werden","rest","schließlich","verdunstet","verbinden","oben"],
 text:[
  ["Das Wasser auf der Erde reist immer im Kreis.","!Zuerst scheint die Sonne auf Meere, Seen und Flüsse und erwärmt das Wasser.","!Dann verdunstet das Wasser und steigt als unsichtbarer Wasserdampf in die Luft.","!Oben am Himmel ist es kalt, und aus dem Dampf werden winzige Tröpfchen. So entstehen Wolken.","!Wenn die Tröpfchen zu schwer werden, fällt Regen oder Schnee auf die Erde.","!Danach fließt das Wasser in Bäche und Flüsse und zurück ins Meer.","?Dann beginnt alles wieder von vorne. Deshalb heißt es Kreislauf."],
  ["Das Wasser auf unserer Erde geht nie verloren, sondern ist ständig unterwegs.","!Zuerst erwärmt die Sonne das Wasser in Meeren, Seen und Flüssen.","!Dann verdunstet ein Teil des Wassers und steigt als unsichtbarer Wasserdampf nach oben.","!Hoch am Himmel ist die Luft kalt, deshalb werden aus dem Dampf winzige Wassertröpfchen, die zusammen Wolken bilden.","!Werden die Tröpfchen größer und schwerer, fallen sie als Regen, Schnee oder Hagel zur Erde.","?Ein Teil des Wassers versickert im Boden und wird zu Grundwasser.","!Der Rest fließt in Bäche und Flüsse und schließlich zurück ins Meer.","?Weil alles immer wieder von vorne beginnt, nennt man das den Kreislauf des Wassers."],
  ["Das Wasser auf unserer Erde gibt es schon seit vielen Millionen Jahren, denn es geht nicht verloren, sondern wandert ständig im Kreis.","!Zuerst erwärmt die Sonne das Wasser in Ozeanen, Seen und Flüssen, aber auch in Pfützen und auf feuchten Blättern.","!Dann verdunstet das Wasser: Es wird zu unsichtbarem Wasserdampf und steigt mit der warmen Luft nach oben.","!In großer Höhe kühlt sich die Luft ab, sodass aus dem Dampf Milliarden winziger Wassertröpfchen werden, die wir als Wolken sehen.","!Verbinden sich viele Tröpfchen zu größeren Tropfen, werden sie zu schwer und fallen als Regen, Schnee oder Hagel zur Erde.","?Ein Teil des Wassers versickert im Boden, wird dort gefiltert und sammelt sich als Grundwasser, aus dem wir unser Trinkwasser gewinnen.","!Der Rest fließt über Bäche und Flüsse zurück in die Meere.","?Weil sich dieser Weg immer wiederholt, sprechen Fachleute vom Wasserkreislauf."]
 ],

 text:[
  ["Werbung siehst du fast überall.","!Es gibt sie im Fernsehen, im Internet, auf Plakaten und in Zeitschriften.","!Werbung will, dass wir etwas kaufen.","!Dafür benutzt sie Tricks: fröhliche Musik, bunte Bilder und bekannte Personen.","?Oft sieht ein Spielzeug in der Werbung größer und toller aus als in echt.","!Mein Tipp: Erst nachdenken! Brauche ich das wirklich?"],
  ["Werbung begegnet uns jeden Tag, oft ohne dass wir es merken.","!Wir sehen sie im Fernsehen, im Internet, in Apps, auf Plakaten, in Zeitschriften und sogar auf Verpackungen.","!Werbung hat ein klares Ziel: Wir sollen ein Produkt kaufen oder es gut finden.","!Dafür arbeitet sie mit Tricks, zum Beispiel mit fröhlicher Musik, leuchtenden Farben, lustigen Figuren oder bekannten Personen.","?Spielzeug wird oft so gezeigt, dass es größer, schneller und spannender wirkt, als es wirklich ist.","!Darum ist es klug, vor dem Kaufen nachzudenken: Brauche ich das wirklich, oder will ich es nur wegen der Werbung?"],
  ["Werbung ist ein ständiger Begleiter in unserem Alltag, auch wenn wir sie oft gar nicht bewusst wahrnehmen.","!Sie begegnet uns im Fernsehen, im Internet, in Apps und Spielen, auf Plakaten, in Zeitschriften und sogar auf Verpackungen im Supermarkt.","!Ihr Ziel ist immer dasselbe: Wir sollen ein Produkt kaufen, eine Marke mögen oder uns an einen Namen erinnern.","!Dafür setzen Werbemacher geschickte Tricks ein, etwa fröhliche Musik, leuchtende Farben, lustige Figuren oder bekannte Personen wie Sportler und Influencer.","?Manchmal sieht ein Spielzeug in einem Werbefilm größer, schneller und spannender aus, als es in Wirklichkeit ist.","?Werbung im Internet ist besonders schwer zu erkennen, wenn sie wie ein ganz normales Video aussieht.","!Deshalb lohnt es sich, kurz innezuhalten und sich zu fragen: Brauche ich das wirklich, oder wünsche ich es mir nur wegen der Werbung?"]
 ],

 text:[
"Es ist Montagmorgen in der Klasse 3a. Im Klassenzimmer wohnt der Hamster Krümel. Diese Woche hat Quirin Hamsterdienst. Er geht zum Käfig und erschrickt. Die Tür vom Käfig ist offen! Der Käfig ist leer. „Krümel ist weg!“, ruft Quirin. Alle Kinder springen auf. Leo und Daria schauen hinter den Schrank. Frau Berger bleibt ruhig. „Wir suchen ihn gemeinsam, aber ganz leise“, sagt sie. „Sonst erschrickt Krümel.“ Nele schaut unter die Tische. Aber Krümel ist nicht zu sehen.",
"Es ist Montagmorgen in der Klasse 3a. In einer Ecke des Klassenzimmers steht ein großer Käfig. Darin wohnt der Hamster Krümel. Diese Woche hat Quirin Hamsterdienst. Er soll Krümel frisches Futter und Wasser geben. Doch als er zum Käfig kommt, erschrickt er. Die kleine Tür steht offen, und das Häuschen ist leer! „Krümel ist verschwunden!“, ruft Quirin. Sofort springen alle Kinder auf. Leo und Daria schauen hinter den Schrank, Niklas und Sascha unter das Regal. Frau Berger, die Klassenlehrerin, bleibt ruhig. „Keine Panik“, sagt sie. „Wir suchen ihn gemeinsam, aber ganz leise, damit wir ihn nicht erschrecken.“ Nele kriecht unter die Tische. Doch von Krümel fehlt jede Spur.",
"Es ist Montagmorgen, und in der Klasse 3a herrscht noch eine verschlafene Stimmung. In einer gemütlichen Ecke des Klassenzimmers steht ein geräumiger Käfig mit Laufrad, Röhren und einem Holzhäuschen. Darin wohnt Krümel, der goldbraune Klassenhamster. Diese Woche hat Quirin Hamsterdienst: Er soll Krümel jeden Morgen frisches Futter und Wasser geben. Doch als er sich dem Käfig nähert, bleibt er wie angewurzelt stehen. Die kleine Gittertür steht sperrangelweit offen, und das Häuschen ist leer! „Krümel ist verschwunden!“, ruft Quirin entsetzt. Augenblicklich springen alle Kinder von ihren Plätzen auf. Leo und Daria durchsuchen den Schrank, Niklas und Sascha kriechen unter das Regal. Nur Frau Berger, die Klassenlehrerin, bleibt gelassen. „Keine Panik“, sagt sie ruhig. „Wir suchen ihn gemeinsam, aber ganz leise, damit wir ihn nicht noch mehr erschrecken.“ Nele kriecht auf allen vieren unter die Tische, doch von Krümel fehlt jede Spur."

"In der Pause sucht Nele weiter. Neben dem Käfig liegen kleine Schalen. Es sind Schalen von Sonnenblumenkernen. „Die frisst Krümel am liebsten!“, sagt Quirin. Toni und Valentin helfen beim Suchen. Nele entdeckt noch mehr Schalen auf dem Boden. Sie liegen in einer Reihe. Die Kinder folgen der Spur. Sie führt quer durch das Klassenzimmer bis zur Leseecke. Dort endet die Spur vor dem großen Bücherregal.",
"In der Pause sucht Nele weiter. Neben dem Käfig entdeckt sie etwas Kleines, Graues auf dem Boden. Es sind leere Schalen von Sonnenblumenkernen. „Die frisst Krümel am liebsten!“, ruft Quirin aufgeregt. Hamster stopfen sich Kerne in ihre Backentaschen und knabbern sie später. Toni und Valentin helfen beim Suchen. Nele geht in die Hocke und findet noch mehr Schalen. Sie liegen wie eine Perlenkette hintereinander. Die Kinder folgen der Spur auf Zehenspitzen. Sie führt unter dem Lehrerpult hindurch, an der Tafel vorbei bis zur Leseecke. Dort endet sie vor dem großen Bücherregal.",
"In der großen Pause will Nele nicht auf den Hof gehen, sondern weitersuchen. Gleich neben dem Käfig entdeckt sie etwas Kleines, Graues auf dem Fußboden. Es sind leere Schalen von Sonnenblumenkernen. „Die frisst Krümel am allerliebsten!“, ruft Quirin aufgeregt. Frau Berger erklärt, dass Hamster sich Kerne in ihre dehnbaren Backentaschen stopfen und sie später in Ruhe knabbern. Toni und Valentin helfen beim Suchen. Nele geht in die Hocke und findet tatsächlich noch weitere Schalen, die wie eine Perlenkette hintereinanderliegen. Auf Zehenspitzen folgen die Kinder der Spur. Sie führt unter dem Lehrerpult hindurch, an der Tafel vorbei und quer durch das Klassenzimmer bis zur gemütlichen Leseecke. Dort endet sie plötzlich vor dem großen Bücherregal."

 text:[
"Im Bücherregal ist Krümel nicht zu finden. „Hamster schlafen am Tag“, sagt Frau Berger. „In der Nacht wird Krümel wach.“ Sie hat eine Idee: Die Kinder bauen eine Hamsterfalle. Sie stellen einen Eimer auf den Boden. Unten in den Eimer legen sie ein weiches Tuch und ein Stück Apfel. Silas und Magdalena bauen aus Büchern eine Treppe zum Eimer hinauf. Severin und Isabel legen das Tuch glatt. „Tut die Falle Krümel weh?“, fragt Quirin besorgt. „Nein“, sagt Frau Berger. „Er rutscht nur weich hinein.“",
"Die Kinder durchsuchen das Bücherregal, doch Krümel ist nirgends zu sehen. „Hamster schlafen tagsüber in einem Versteck“, erklärt Frau Berger. „Erst am Abend und in der Nacht werden sie munter.“ Dann hat sie eine Idee: Die Klasse baut eine sichere Hamsterfalle. Die Kinder stellen einen hohen Eimer vor das Regal. Unten hinein legen sie ein weiches Handtuch, ein Stück Apfel und ein paar Sonnenblumenkerne. Silas und Magdalena bauen aus dicken Büchern eine Treppe bis zum Rand des Eimers. Severin und Isabel streichen das Handtuch glatt. „Tut die Falle Krümel auch nicht weh?“, fragt Quirin besorgt. „Keine Sorge“, sagt Frau Berger. „Er rutscht nur weich auf das Handtuch und kann nicht mehr herausklettern.“ Am Nachmittag gehen alle gespannt nach Hause.",
"Gemeinsam durchsuchen die Kinder jedes Fach des Bücherregals, doch Krümel bleibt unauffindbar. „Hamster schlafen tagsüber gut versteckt“, erklärt Frau Berger. „Sie sind nachtaktiv und werden erst am Abend richtig munter.“ Dann kommt ihr eine Idee: Die Klasse soll eine sichere Hamsterfalle bauen. Die Kinder stellen einen hohen Eimer direkt vor das Regal. Unten hinein legen sie ein weiches Handtuch, ein saftiges Stück Apfel und eine Handvoll Sonnenblumenkerne. Silas und Magdalena bauen aus dicken Wörterbüchern eine stabile Treppe, die bis zum Rand des Eimers reicht. Severin und Isabel streichen das Handtuch sorgfältig glatt. „Tut die Falle Krümel auch bestimmt nicht weh?“, fragt Quirin besorgt. „Keine Sorge“, beruhigt ihn Frau Berger. „Er klettert die Treppe hinauf, um an das Futter zu kommen, und rutscht dann weich auf das Handtuch. Herausklettern kann er nicht mehr.“ Am Nachmittag verlassen alle gespannt das Klassenzimmer. Quirin dreht sich an der Tür noch einmal um und flüstert: „Gute Nacht, Krümel.“"

const PARENT_LETTER=`Liebe Eltern der Klasse 3a,

in diesem Schuljahr trainieren wir das Lesen ganz gezielt – jeden Tag ein bisschen. Dafür nutzen wir in der Schule die Lese-App „Leseflieger“.

Was üben wir?
• Flüssig lesen: Die Kinder hören einen Text, lesen halblaut mit und lesen ihn dann selbst laut vor. Wiederholtes Lesen macht das Lesen schneller und sicherer.
• Verstehen: Die Kinder lernen Strategien, mit denen sie Geschichten und Sachtexte besser verstehen – zum Beispiel vor dem Lesen Fragen stellen, wichtige Stellen markieren und das Gelesene mit eigenen Worten wiedergeben.

Das Lesetandem
Oft lesen zwei Kinder zusammen: Ein Kind liest laut („Pilot“), das andere zeigt im Text mit und hilft freundlich, wenn es stockt („Co-Pilot“). Danach wird getauscht. Das können Sie auch zu Hause machen: Lassen Sie Ihr Kind vorlesen, zeigen Sie mit dem Finger mit und loben Sie, was schon gut klappt.

Lesen zu Hause
Wenn Sie den Link zur App von uns bekommen, kann Ihr Kind zu Hause einen Text der Woche vorlesen. Bitte bestätigen Sie danach in der App, dass Ihr Kind Ihnen vorgelesen hat. Am Ende der Woche kann die App einen kurzen Code erzeugen, den Sie mir schicken.

Schon 10 Minuten Vorlesen am Tag machen einen großen Unterschied.

Vielen Dank für Ihre Unterstützung!

Mit freundlichen Grüßen
`;

function findGloss(u,tok){ const n=norm(tok); if(!n)return -1; const G=glossOf(u);
  for(let i=0;i<G.length;i++){ const forms=[norm(G[i][0])].concat((G[i][1]||"").split(",").map(norm).filter(Boolean));
    for(const f of forms){ if(n===f) return i; if(f.length>2&&n.startsWith(f)&&SUF.includes(n.slice(f.length))) return i; } }
  return -1; }

const HAS_TTS="speechSynthesis" in window;
let VOICE=null, PLAYING=false, HI_ID="txt", TIMERS=[];
function pickVoice(){ if(!HAS_TTS)return; const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang)); VOICE=vs.find(v=>/Anna|Petra|Helena|Markus|Google/i.test(v.name))||vs[0]||null; }

function clearTimers(){TIMERS.forEach(t=>{clearTimeout(t);clearInterval(t);}); TIMERS=[];}

function setHi(i){
  const box=document.getElementById(HI_ID); if(!box)return;
  const old=box.querySelector(".w.on"); if(old)old.classList.remove("on");
  const el=box.querySelector(`.w[data-i="${i}"]`); if(el){el.classList.add("on"); rulerFollow(el);
    const r=el.getBoundingClientRect(); if(r.bottom>window.innerHeight-40||r.top<0) el.scrollIntoView({block:"center",behavior:"smooth"});}
}
function utter(text,rate){const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; if(VOICE)u.voice=VOICE; u.rate=rate; return u;}
function sayWord(w){ if(!HAS_TTS)return; try{speechSynthesis.cancel(); speechSynthesis.speak(utter(w.replace(/-/g,""),0.7));}catch(e){} }
function speakTokens(tokens,wpm,onEnd){
  clearTimers(); const busy=speechSynthesis.speaking||speechSynthesis.pending; if(busy){try{speechSynthesis.cancel();}catch(e){}} PLAYING=true;
  // in Sätze gliedern
  const chunks=[]; let cur=null;
  tokens.forEach((t,i)=>{ if(!cur){cur={start:i,toks:[]};chunks.push(cur);} cur.toks.push(t); if(/[.!?:]["“”«»]?$/.test(t)) cur=null; });
  chunks.forEach(c=>{let off=0; c.offsets=c.toks.map(t=>{const o=off; off+=t.length+1; return o;}); c.text=c.toks.join(" ");});
  const rate=Math.max(0.4,Math.min(1.2,wpm/170)); const step=60000/wpm;
  let ci=0;
  if(busy) TIMERS.push(setTimeout(()=>next(),120)); else next();
  function next(){
    if(!PLAYING)return;
    if(ci>=chunks.length){PLAYING=false; onEnd&&onEnd(); return;}
    const c=chunks[ci]; const u=utter(c.text,rate); let gotB=false, wi=0;
    u.onstart=()=>{ setHi(c.start); const tick=()=>{ if(gotB||!PLAYING)return; wi++; if(wi<c.toks.length){setHi(c.start+wi); TIMERS.push(setTimeout(tick,step));} }; TIMERS.push(setTimeout(tick,step)); };
    u.onboundary=e=>{ if(e.name&&e.name!=="word")return; gotB=true; let k=0; for(let j=0;j<c.offsets.length;j++){ if(e.charIndex>=c.offsets[j]) k=j; } setHi(c.start+k); };
    u.onend=()=>{ ci++; next(); };
    u.onerror=()=>{ ci++; next(); };
    speechSynthesis.speak(u);
  }
}
function startPacer(n,wpm,onEnd){
  clearTimers(); let i=0; setHi(0);
  const id=setInterval(()=>{ i++; if(i>=n){clearInterval(id); onEnd&&onEnd(); return;} setHi(i); },60000/wpm);
  TIMERS.push(id);
}

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function confetti(){ const e=["⭐","🌟","🎉","✨","🍂","🦔"]; for(let i=0;i<26;i++){ const s=document.createElement("span"); s.className="conf"; s.textContent=e[i%e.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDelay=(Math.random()*0.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3600);} }
const readers=()=>st.mode==="tandem"?[st.kid,st.kid2]:(st.mode==="solo"?[st.kid]:[]);

function who(){
  if(["home","pin","teacher"].includes(st.screen)) return "";
  if(st.mode==="class") return `<span class="chip">🧑‍🏫 Klasse</span>`;
  return readers().filter(Boolean).map(id=>`<span class="chip">${esc(kidName(id))} · ⭐ ${DB.stars[id]||0}</span>`).join("");
}
function topBar(title,back){ return `<div class="top">${back?`<button class="back" onclick="${back}">◀ Zurück</button>`:""}<h1>${title}</h1>${who()}${["acts","flowF","flowS","flowR","flowRec","flowT","flowB","flowL","flowTrail","hub","list"].includes(st.screen)?`<button class="chip" onclick="st.prefOpen=true;render()" title="Schrift und Lesehilfen">🔤 Aa</button>`:""}</div>`; }
const PLANE=`<svg width="92" height="92" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#fff"/><path d="M18 52 L84 22 L62 80 L50 58 Z" fill="#2f7fd1"/><path d="M50 58 L84 22 L44 54 Z" fill="#1f5fa3"/><path d="M50 58 L56 72 L62 80 Z" fill="#8cc0f0"/><circle cx="30" cy="74" r="4" fill="#ffe27a"/><circle cx="20" cy="64" r="2.5" fill="#ffe27a"/></svg>`;

// ===== Bildschirme =====
function vHome(){
  return `<div class="hero">${PLANE}<div><h1>Leseflieger</h1><p>Lesetraining · Leseflüssigkeit und Lesestrategien</p></div></div>
  <div class="grid">
    <button class="big" onclick="pickMode('solo')"><span class="ic">🧒</span><b>Ich übe allein</b><small>Mit Vorlesestimme, Stoppuhr und Lesestrategien</small></button>
    <button class="big" onclick="pickMode('tandem')"><span class="ic">👫</span><b>Wir üben im Tandem</b><small>Pilot liest, Co-Pilot liest mit und hilft</small></button>
    <button class="big" onclick="pickMode('class')"><span class="ic">🧑‍🏫</span><b>Klasse / Tafel</b><small>Große Schrift zum gemeinsamen Üben und Modellieren</small></button>
    ${DB.home?`<button class="big" onclick="go('homeM',{d:{}})"><span class="ic">🏠</span><b>Lesen zu Hause</b><small>Den Text des Tages den Eltern vorlesen</small></button>`:""}
  </div>
  <div class="row mt"><button class="btn sec" onclick="go('pin',{d:{pin:''}})">⚙️ Lehrkraft-Bereich</button>
  ${STORAGE_OK?"":`<span class="muted">Hinweis: Auf diesem Gerät kann nichts dauerhaft gespeichert werden.</span>`}</div>`;
}
function pickMode(m){
  st.mode=m; st.kid=null; st.kid2=null; st.sel=[];
  st.daz=false; if(m==="class"){ st.lv=2; go("hub"); } else go("kids");
}
function vKids(){
  const tandem=st.mode==="tandem";
  let h=topBar(tandem?"Wer übt zusammen?":"Wer bist du?","go('home')");
  const real=DB.kids.filter(k=>!/^Gast( |$)/.test(k.name));
  if(tandem&&real.length<2){
    h+=`<div class="card"><p class="instr">${real.length?"Für ein Tandem braucht ihr zwei Namen.":"Es sind noch keine Namen angelegt."} Tragt eure Vornamen hier ein – sie werden gespeichert und stehen dann auch im Lehrkraft-Bereich.</p>
    <label class="lab">🧑‍✈️ Pilot (liest zuerst)</label><input type="text" id="qn1" maxlength="30" placeholder="Vorname" value="${real[0]?esc(real[0].name):""}">
    <label class="lab">🧭 Co-Pilot</label><input type="text" id="qn2" maxlength="30" placeholder="Vorname">
    <div class="row mt"><button class="btn green" onclick="quickTandem()">Los geht's ➜</button><button class="btn sec" onclick="guestTandem()">Als Gast-Tandem üben</button></div></div>`; return h;
  }
  if(!DB.kids.length){
    h+=`<div class="card"><p class="instr">Es sind noch keine Namen angelegt. Trag deinen Vornamen ein oder übe als Gast.</p>
    <label class="lab">Dein Vorname</label><input type="text" id="qn1" maxlength="30" placeholder="Vorname">
    <div class="row mt"><button class="btn green" onclick="quickSolo()">Los geht's ➜</button><button class="btn sec" onclick="guest()">Als Gast üben</button></div></div>`; return h;
  }
  if(tandem) h+=`<p class="instr">Tippt zuerst an, wer <b>Pilot</b> ist, dann, wer <b>Co-Pilot</b> ist. Die Rollen wechselt ihr später.</p>`;
  h+=`<div class="grid">`+DB.kids.slice().sort((a,b)=>a.name.localeCompare(b.name,"de")).map(k=>{const pos=st.sel.indexOf(k.id);
    return `<button class="big ${pos>=0?"sel":""}" style="min-height:6rem" onclick="pickKid('${k.id}')"><b>${esc(k.name)}</b><small>${LV[k.level||2].i} ${LV[k.level||2].n} · ⭐ ${DB.stars[k.id]||0}${pos===0?" · 🧑‍✈️ Pilot":pos===1?" · 🧭 Co-Pilot":""}</small></button>`;}).join("")+`</div>`;
  if(tandem) h+=`<div class="row mt"><button class="btn green" ${st.sel.length===2?"":"disabled"} onclick="startTandem()">Los geht's ➜</button></div>`;
  return h;
}
function guest(){ let g=DB.kids.find(k=>k.name==="Gast"); if(!g){g={id:uid(),name:"Gast",level:2};DB.kids.push(g);save();} pickKid(g.id); }
function kidByNameOrNew(n){ n=n.trim().replace(/\s+/g," ").slice(0,30); let k=DB.kids.find(x=>x.name.toLowerCase()===n.toLowerCase()); if(!k){k={id:uid(),name:n,level:2};DB.kids.push(k);} return k; }
function quickTandem(){ const a=($("#qn1").value||"").trim(), b=($("#qn2").value||"").trim();
  if(!a||!b){ toast("Bitte beide Vornamen eintragen."); return; } if(a.toLowerCase()===b.toLowerCase()){ toast("Bitte zwei verschiedene Namen eintragen."); return; }
  const k1=kidByNameOrNew(a), k2=kidByNameOrNew(b); save(); st.sel=[k1.id,k2.id]; startTandem(); }
function guestTandem(){ const ids=["Gast 1","Gast 2"].map(n=>{ let g=DB.kids.find(k=>k.name===n); if(!g){g={id:uid(),name:n,level:2};DB.kids.push(g);} return g.id; }); save(); st.sel=ids; startTandem(); }
function quickSolo(){ const a=($("#qn1").value||"").trim(); if(!a){ toast("Bitte deinen Vornamen eintragen."); return; } const k=kidByNameOrNew(a); save(); pickKid(k.id); }
function pickKid(id){
  if(st.mode==="solo"){ st.kid=id; st.lv=(kidById(id).level||2); st.daz=!!kidById(id).daz; if(st.daz)st.tempo=80; go("hub"); return; }
  const p=st.sel.indexOf(id); if(p>=0) st.sel.splice(p,1); else if(st.sel.length<2) st.sel.push(id); render();
}
function startTandem(){ st.kid=st.sel[0]; st.kid2=st.sel[1]; st.lv=(kidById(st.kid).level||2); st.daz=!!(kidById(st.kid).daz||kidById(st.kid2).daz); if(st.daz)st.tempo=80; go("hub"); }

function lvSeg(){ return `<div class="seg">${[1,2,3].map(l=>`<button class="${st.lv===l?"on":""}" onclick="st.lv=${l};render()">${LV[l].i} ${LV[l].n}</button>`).join("")}</div>`; }
function vHub(){
  let h=topBar(st.mode==="class"?"Lesetraining mit der Klasse":"Was möchtest du üben?", st.mode==="class"?"go('home')":"go('kids')");
  h+=`<div class="row" style="margin-bottom:1rem"><span class="fred" style="font-size:1.25rem">Textstufe:</span>${lvSeg()}${dazBtn()}</div>`;
  h+=planCard();
  h+=`<div class="grid">
   <button class="big" onclick="go('list',{area:'f'})"><span class="ic">🎧</span><b>Flüssig lesen</b><small>Lesetraining, Lese-Challenge, Aufnehmen, Lesetheater, Satz-Blitzlesen</small></button>
   <button class="big" onclick="go('list',{area:'s'})"><span class="ic">🧭</span><b>Verstehen</b><small>Lesestrategien, Lügentexte und die Lesespur</small></button>
   ${st.mode!=="class"?`<button class="big" onclick="go('book')"><span class="ic">📒</span><b>Mein Flugbuch</b><small>Stempel, Sterne und Abzeichen</small></button>`:""}
  </div>`;
  return h;
}
function unitCard(u){
  const id=st.kid; const sp=(id&&DB.stamps[id])||{}; const done=sp[st.area+":"+u.id]; const inPlan=DB.plan&&DB.plan.ids&&DB.plan.ids.includes(u.id);
  const sub=u.type==="custom"?"Eigener Text":u.type==="story"?`Kapitel ${u.nr}`:(u.vis==="netz"?"Sachtext · Merkmale":"Sachtext · Ablauf");
  return `<button class="big" style="min-height:7.5rem" onclick="openUnit('${u.id}')"><span class="ic">${esc(u.icon||"📄")}</span><b>${esc(u.title)}</b><small>${sub}${inPlan?" · 📅 diese Woche":""}${done?` · ✅ geübt (${LV[done].n})`:""}</small></button>`;
}
function vList(){
  let h=topBar(st.area==="f"?"🎧 Flüssig lesen":"🧭 Verstehen","go('hub')");
  h+=`<div class="row" style="margin-bottom:0.75rem"><span class="fred" style="font-size:1.25rem">Textstufe:</span>${lvSeg()}${dazBtn()}</div>`;
  if(st.area==="s") h+=`<h2>🐾 Lesespur</h2><div class="grid" style="margin-bottom:1rem"><button class="big" style="min-height:6.875rem" onclick="startTrail()"><span class="ic">🐾</span><b>${esc(TRAIL.title)}</b><small>Folge der Spur durch den Wald und finde das Lösungswort${finsOf(st.kid).some(r=>r.u==="trail")?" · ✅":""}</small></button></div>`;
  h+=`<h2>📚 Geschichte: ${STORY_TITLE}</h2><div class="grid">${UNITS.filter(u=>u.type==="story").map(unitCard).join("")}</div>`;
  h+=`<h2 class="mt">🔎 Sachtexte</h2><div class="grid">${UNITS.filter(u=>u.type==="fact").map(unitCard).join("")}</div>`;
  const C=(DB.custom||[]).filter(u=>st.area==="f"||(u.qs&&u.qs.length)||liesOf(u).length>=3);
  if(C.length) h+=`<h2 class="mt">📝 Eigene Texte</h2><div class="grid">${C.map(unitCard).join("")}</div>`;
  if(st.area==="s"&&(DB.custom||[]).length>C.length) h+=`<p class="muted mt">Eigene Texte ohne Fragen erscheinen nur bei „Flüssig lesen“.</p>`;
  if(st.area==="s") h+=`<p class="muted mt">Tipp: Lest die Kapitel der Geschichte der Reihe nach.</p>`;
  return h;
}

// ===== Flüssig lesen =====
function tempoSeg(){ return `<div class="seg">${TEMPO.map(t=>`<button class="${st.tempo===t.k?"on":""}" onclick="setTempo(${t.k})">${t.i} ${t.n}</button>`).join("")}</div>`; }
function setTempo(k){ stopAll(); st.tempo=k; render(); }
function togglePlay(boxId){
  if(st.d.playing){ stopAll(); render(); return; }
  stopAll(); st.d.playing=true; render(); HI_ID=boxId||"txt";
  const str=fullText(st.unit,st.lv);
  if(HAS_TTS) speakTokens(toks(str),st.tempo,()=>{st.d.playing=false; render();});
  else startPacer(toks(str).length,st.tempo,()=>{st.d.playing=false; render();});
}
function playerHTML(boxId){
  return `<div class="row">${tempoSeg()}<button class="btn ${st.d.playing?"orange":""}" onclick="togglePlay('${boxId||"txt"}')">${st.d.playing?"⏹ Stopp":"🔊 Vorlesen"}</button></div>
  ${HAS_TTS?"":`<p class="muted">Auf diesem Gerät gibt es keine Vorlesestimme – stattdessen wandert der Lesepfeil im gewählten Tempo mit.</p>`}${st.daz?DAZ_LEG:""}`;
}
function vFlowF(){
  const u=st.unit, s=st.step; let h=topBar(`${esc(u.icon||"📄")} ${esc(u.title)}`,"go('acts')");
  h+=`<div class="steps">${F_STEPS.map((n,i)=>`<span class="st ${i===s?"cur":(i<s?"done":"")}">${i+1}. ${n}</span>`).join("")}<span class="st">${LV[st.lv].i} ${LV[st.lv].n}</span></div>`;
  if(st.mode==="class") h+=`<div class="tip"><b>Tipp für die Lehrkraft:</b> ${TIPS_F[s]}</div>`;
  const str=fullText(u,st.lv);
  h+=`<div class="card">`;
  if(s===0){
    h+=`<p class="instr">Diese Wörter kommen im Text vor. Tippe ein Wort an und hör es dir an. Lies es dann selbst laut – Silbe für Silbe.</p>
    <div class="words">${u.words.map((w,i)=>`<button class="word" onclick="sayWord(st.unit.words[${i}])">${st.daz?stolperDaz(w):""}${syl(w)}</button>`).join("")}</div>`;
    if(st.d.bi!=null){ const w=u.words[st.d.bi];
      h+=`<div class="blitz">${st.d.bs?syl(w):"❓"}</div><p class="instr" style="text-align:center">${st.d.bs?"Lies das Wort schnell!":"Welches Wort war das? Sag es laut!"}</p>
      <div class="row"><button class="btn sec" onclick="st.d.bs=true;render()">👀 Aufdecken</button><button class="btn" onclick="blitz()">⚡ Nächstes Wort</button></div>`;
    } else h+=`<div class="row mt"><button class="btn orange" onclick="st.d.bi=-1;blitz()">⚡ Blitzlesen starten</button></div>`;
    const G=glossOf(u); if(G.length) h+=`<h3 class="mt">🔍 Wörter klären</h3><p class="muted">Kennst du alle diese Wörter? Tippe ein Wort an, dann bekommst du eine Erklärung. Im Text sind diese Wörter lila unterstrichen.</p><div class="bank">${G.map((g,i)=>`<button class="opt" style="font-size:1.1875rem" onclick="openGloss(${i})">${esc(g[3]||"")} ${esc(g[0])}</button>`).join("")}</div>`;
    h+=`<div class="row mt"><span class="sp"></span><button class="btn green" onclick="fNext()">Weiter: Hören ➜</button></div>`;
  } else if(s===1||s===2){
    h+=`<p class="instr">${s===1?"👂 <b>1. Durchgang:</b> Hör gut zu. Fahre mit dem Finger oder einem Stift unter den Wörtern mit.":"🗣️ <b>2. Durchgang:</b> Lies jetzt halblaut mit der Stimme mit."}</p>${playerHTML()}
    <div class="textbox mt"><div class="text" id="txt">${textHTML(str,{gl:u})}</div></div>
    <p class="muted">🔍 Lila unterstrichene Wörter kannst du antippen – dann bekommst du eine Erklärung.</p>
    <div class="row mt"><button class="btn sec" onclick="fBack()">◀</button><span class="sp"></span><button class="btn green" onclick="fNext()">${s===1?"Weiter: Mitlesen ➜":"Weiter: Selbst lesen ➜"}</button></div>`;
  } else if(s===3){ h+=selfRead(str); }
  h+=`</div>`; return h;
}
function blitz(){ const n=st.unit.words.length; let i=Math.floor(Math.random()*n); if(n>1&&i===st.d.bi) i=(i+1)%n; st.d.bi=i; st.d.bs=true; render(); clearTimers(); TIMERS.push(setTimeout(()=>{ if(st.screen==="flowF"&&st.step===0){st.d.bs=false; render();} }, st.mode==="class"?1500:1000)); }
function fNext(){ stopAll(); st.step++; st.d.r="ready"; st.d.err=[]; st.d.round=0; render(); window.scrollTo(0,0); }
function fBack(){ stopAll(); st.step--; render(); }

function selfRead(str){
  const tandem=st.mode==="tandem", cls=st.mode==="class"; const r=st.d.r||"ready";
  const reader=tandem?(st.d.round===1?st.kid2:st.kid):st.kid, trainer=tandem?(st.d.round===1?st.kid:st.kid2):null;
  let h="";
  if(cls) h+=`<p class="instr">🎤 <b>3. Durchgang – Chorlesen:</b> Lest gemeinsam laut. Der Lesepfeil gibt das Tempo vor.</p>`;
  else if(tandem) h+=`<p class="instr">🧑‍✈️ <b>Pilot: ${esc(kidName(reader))}</b> liest laut vor.<br>🧭 <b>Co-Pilot: ${esc(kidName(trainer))}</b> zeigt mit dem Finger mit und tippt auf Wörter, bei denen ${esc(kidName(reader))} stolpert.</p>`;
  else h+=`<p class="instr">🎤 <b>3. Durchgang:</b> Lies den Text jetzt allein laut vor. Tippe auf Start, wenn du anfängst, und auf Fertig, wenn du am Ende bist.</p>`;
  const tap=tandem&&(r==="run"||r==="done");
  h+=`<div class="row">`;
  if(r==="ready"){ h+=`<button class="btn green" onclick="srStart()">▶ Start</button>`; if(!cls) h+=`<button class="btn sec" onclick="pace()">${st.d.pacing?"⏹ Lesepfeil aus":"➡️ Lesepfeil (Tempo-Hilfe)"}</button>`; if(cls||st.d.pacing) h+=tempoSeg(); if(!cls&&srAvail()) h+=`<button class="btn small ${st.d.srOn?"green":"sec"}" onclick="st.d.srOn=!st.d.srOn;render()">🎤 Mitlese-Check ${st.d.srOn?"an":"aus"}</button>`; }
  if(r==="run"){ h+=`<span class="timer" id="timer">0:00</span><button class="btn red" onclick="srStop()">⏹ Fertig</button>`; if(cls) h+=`<span class="muted">Der Lesepfeil läuft …</span>`; }
  h+=`</div>`;
  h+=`<div class="textbox mt"><div class="text" id="txt">${textHTML(str,{tap,err:st.d.err||[],sr:st.d.srOn?st.d.srm:null})}</div></div>`;
  if(r==="done"){
    const res=st.d.res;
    if(cls){ h+=`<div class="fb ok">👏 Toll gelesen, Klasse! Zeit: ${res.sec} Sekunden.</div><div class="row mt"><button class="btn sec" onclick="srAgain()">🔁 Nochmal lesen</button><span class="sp"></span><button class="btn green" onclick="finishF()">Fertig ➜</button></div>`; return h; }
    h+=`<div class="row mt" style="gap:1.625rem"><div><div class="bigstat">${res.wpm}</div><div class="muted">Wörter pro Minute</div></div><div><div class="bigstat">${res.sec}</div><div class="muted">Sekunden</div></div>${tandem?`<div><div class="bigstat">${(st.d.err||[]).length}</div><div class="muted">Stolperwörter</div></div>`:""}${res.best?`<div><div class="bigstat">${res.best}</div><div class="muted">deine Bestleistung bei diesem Text</div></div>`:""}</div>`;
    if(res.better) h+=`<div class="fb ok">🚀 Neue Bestleistung bei diesem Text!</div>`;
    h+=srSummary();
    if(tandem){
      h+=`<h3 class="mt">${esc(kidName(trainer))}, gib eine Rückmeldung:</h3>`+fbRows();
      h+=`<div class="row mt">${st.d.round===0?`<button class="btn orange" onclick="swapRoles()">🔄 Rollen tauschen</button>`:`<span class="sp"></span><button class="btn green" onclick="finishF()">Fertig ➜</button>`}</div>`;
    } else {
      h+=`<h3 class="mt">Wie hast du gelesen?</h3><div class="row">${[["😊","flüssig"],["🙂","ganz gut"],["😐","noch holprig"]].map(([e,n])=>`<button class="btn sec ${st.d.self===n?"green":""}" style="${st.d.self===n?"color:#fff":""}" onclick="selfRate('${n}')">${e} ${n}</button>`).join("")}</div>
      <div class="row mt"><button class="btn sec" onclick="srAgain()">🔁 Nochmal lesen</button><span class="sp"></span><button class="btn green" onclick="finishF()">Fertig ➜</button></div>`;
    }
  }
  return h;
}
const FB_CRIT=[["g","Genau gelesen"],["f","Flüssig gelesen"],["b","Betont gelesen"]];
const FB_VAL=[["🌟","super"],["👍","gut"],["💪","üben wir noch"]];
function fbRows(){ const fb=(st.d.lastRec&&st.d.lastRec.fb)||{};
  return FB_CRIT.map(([k,n])=>`<div class="row" style="margin:0.5rem 0"><span style="min-width:10.625rem;font-size:1.1875rem">${n}</span>${FB_VAL.map(([e,v])=>`<button class="btn small ${fb[k]===v?"green":"sec"}" onclick="setFb('${k}','${v}')">${e} ${v}</button>`).join("")}</div>`).join(""); }
function setFb(k,v){ if(!st.d.lastRec)return; st.d.lastRec.fb=st.d.lastRec.fb||{}; st.d.lastRec.fb[k]=v; save(); render(); }
function selfRate(n){ st.d.self=n; if(st.d.lastRec){st.d.lastRec.fb={self:n}; save();} render(); }
function pace(){ if(st.d.pacing){stopAll(); render(); return;} st.d.pacing=true; render(); HI_ID="txt"; startPacer(toks(fullText(st.unit,st.lv)).length,st.tempo,()=>{st.d.pacing=false;}); }
function srStart(){
  const pacing=st.d.pacing||st.mode==="class"; stopAll(); st.d.r="run"; st.d.err=[]; st.d.t0=Date.now(); render(); HI_ID="txt";
  TIMERS.push(setInterval(()=>{const el=$("#timer"); if(el){const s=Math.floor((Date.now()-st.d.t0)/1000); el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}},500));
  if(pacing) startPacer(toks(fullText(st.unit,st.lv)).length,st.tempo,null);
  if(st.d.srOn&&srAvail()) startSR();
}
function srStop(){
  if(st.d.srOn) stopSR(); stopAll(); const sec=Math.max(1,Math.round((Date.now()-st.d.t0)/1000)); const words=wordCount(fullText(st.unit,st.lv));
  const wpm=Math.round(words/(sec/60)); const res={sec,wpm};
  if(st.mode!=="class"){
    const reader=st.mode==="tandem"?(st.d.round===1?st.kid2:st.kid):st.kid;
    const prev=recsOf(reader).filter(r=>r.kind==="f"&&r.u===st.unit.id&&r.lv===st.lv).map(r=>r.wpm);
    const best=prev.length?Math.max(...prev):0; res.better=prev.length>0&&wpm>best; res.best=Math.max(best,wpm);
    const rec={k:reader,t:Date.now(),kind:"f",u:st.unit.id,lv:st.lv,wpm,sec,err:st.mode==="tandem"?(st.d.err||[]).length:null,mode:st.mode};
    DB.records.push(rec); save(); st.d.lastRec=rec; st.d.self=null;
    if(res.better) st.d.bonus=(st.d.bonus||0)+1;
  }
  st.d.res=res; st.d.r="done"; render();
}
function srAgain(){ stopAll(); st.d.r="ready"; st.d.err=[]; st.d.srm=null; render(); }

function fbHTML(t){

  if(t.tries) return `<div class="fb bad">🔎 Noch nicht ganz. Schau noch einmal im Text nach und versuche es nochmal. ${lookBtn()}</div>`;
  return "";
}
function resolve(ok){ const t=st.d.t; if(ok){ t.done=true; t.ok=true; t.first=!t.tries; } else { t.tries=(t.tries||0)+1; if(t.tries>=2){t.done=true; t.ok=false;} } render(); }
function answerMC(i){ const t=st.d.t, k=tasks()[st.step]; if(t.done)return; if(i===k.a) resolve(true); else { t.bad=t.bad||[]; if(!t.bad.includes(i))t.bad.push(i); resolve(false);} }
function answerFly(v){ const t=st.d.t; if(t.done)return; if(v===st.unit.vis) resolve(true); else { t.bad=[v]; resolve(false);} }
function toggleMulti(i){ const t=st.d.t; if(t.done)return; t.checked=false; t.sel=t.sel||[]; const p=t.sel.indexOf(i); if(p>=0)t.sel.splice(p,1); else t.sel.push(i); render(); }
function checkMulti(){ const t=st.d.t, k=tasks()[st.step]; const s=(t.sel||[]).slice().sort().join(), a=k.a.slice().sort().join(); t.checked=true; resolve(s===a); }
function toggleSent(i){ const t=st.d.t; if(t.done)return; t.checked=false; t.mk=t.mk||[]; const p=t.mk.indexOf(i); if(p>=0)t.mk.splice(p,1); else t.mk.push(i); render(); }
function checkMark(){
  const t=st.d.t, S=sentences(st.unit,st.lv), mk=t.mk||[];
  const missing=S.filter((x,i)=>x.k==="!"&&!mk.includes(i)).length, wrong=mk.filter(i=>!S[i].k).length;

function pickBranch(j){ const t=st.d.t; t.pick[t.act]=j; t.checked=false; const nx=st.unit.branches.findIndex((b,i)=>t.pick[i]==null); if(nx>=0)t.act=nx; render(); }

  let h=`<div class="row"><h2 class="sp">🔗 Textbild: Kette</h2>${lookBtn()}</div><p class="instr">Was passiert zuerst, was danach? Tippe die Kärtchen in der richtigen Reihenfolge an. Zum Entfernen tippst du ein Kärtchen in der Kette an.</p>`;
  h+=`<div class="kette">`+u.steps.map((s,i)=>{const v=t.chain[i]; let c=v==null?"empty":""; if(t.checked&&v!=null)c=(v===i?"ok":"bad");

  if(!t.done){ h+=`<div class="bank">`+o.filter(i=>!t.chain.includes(i)).map(i=>`<button class="opt" onclick="chain(${i})">${esc(u.steps[i])}</button>`).join("")+`</div>`;

function chain(i){ const t=st.d.t; if(t.done)return; t.checked=false; const free=[...Array(st.unit.steps.length).keys()].find(p=>t.chain[p]==null); if(free!=null) t.chain[free]=i; render(); }
function unchain(p){ const t=st.d.t; if(t.done)return; t.checked=false; t.chain[p]=undefined; while(t.chain.length&&t.chain[t.chain.length-1]==null)t.chain.pop(); render(); }

function ketteSolved(u){ return `<div class="kette">`+u.steps.map((s,i)=>(i?`<span class="arrow">➜</span>`:"")+`<div class="glied ok"><span class="nr">${i+1}</span>${esc(s)}</div>`).join("")+`</div>`; }

function finishS(){

  finishFlow("s",sc+1+(own.length?1:0),[`${sc} von ${mx} Aufgaben beim ersten Versuch richtig.`].concat(own.length?[`Du hast ${own.length} eigene Frage${own.length>1?"n":""} gestellt – so lesen echte Leseprofis!`]:[]),id=>({k:id,t:Date.now(),kind:"s",u:st.unit.id,lv:st.lv,sc,mx,mode:st.mode,own:own.length?own:undefined,ans:own.length?ans:undefined}));

// ===== Abschluss, Flugbuch, Abzeichen =====
function earned(id){
  const R=recsOf(id), fins=R.filter(r=>r.kind==="fin"), has=new Set();
  if(fins.length>=1)has.add("first"); if(fins.length>=5)has.add("five"); if(fins.length>=12)has.add("twelve");
  const sDone=new Set(fins.filter(r=>r.area==="s"&&(!r.act||r.act==="strat")).map(r=>r.u));
  if(["g1","g2","g3","g4"].every(x=>sDone.has(x)))has.add("detektiv");
  if(["s1","s2","s3","s4"].every(x=>sDone.has(x)))has.add("pilot");
  const f=R.filter(r=>r.kind==="f").sort((a,b)=>a.t-b.t); if(f.length>1&&Math.max(...f.slice(1).map(r=>r.wpm))>=f[0].wpm+10)has.add("speed");
  if(R.some(r=>r.kind==="s"&&r.mx>0&&r.sc===r.mx))has.add("perfect");
  if(fins.some(r=>r.mode==="tandem"))has.add("team");
  if(fins.some(r=>r.act==="race"&&r.improved))has.add("race"); if(fins.some(r=>r.act==="theater"))has.add("theater");
  if(fins.some(r=>r.act==="lie"&&r.perfect))has.add("liar"); if(fins.some(r=>r.act==="trail"))has.add("trail");
  if(((DB.recs||[]).filter(r=>r.k===id)).length>=3)has.add("rec");
  return has;
}
function finishFlow(area,stars,lines,extra,flags){
  stopAll(); const ids=readers(); const fresh={};
  ids.forEach(id=>{ const before=earned(id); if(extra) DB.records.push(extra(id)); DB.records.push(Object.assign({k:id,t:Date.now(),kind:"fin",area,act:st.act||(area==="f"?"train":"strat"),u:st.unit.id,lv:st.lv,mode:st.mode,st:stars},flags||{})); addStars(id,stars); stamp(id,area+":"+st.unit.id,st.lv);
    const after=earned(id); fresh[id]=[...after].filter(b=>!before.has(b)); });
  save(); st.sum={area,stars,lines,fresh}; go("done"); confetti();
}

function pinKey(n){ st.d.pin=(st.d.pin||"")+n; if(st.d.pin.length<4){render();return;}
  if(st.d.pin===DB.pin){ go("teacher",{tab:"ov",detail:null,d:{}}); } else { st.d.pin=""; render(); const e=$("#pd"); if(e){e.classList.add("shake");} } }
function spark(vals){ if(vals.length<2) return ""; const w=110,h=30,mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#2f7fd1" stroke-width="2.5" stroke-linejoin="round"/></svg>`; }
function kidStats(k){
  const R=recsOf(k.id), f=R.filter(r=>r.kind==="f").sort((a,b)=>a.t-b.t), s=R.filter(r=>["s","b","l"].includes(r.kind));
  const sc=s.reduce((a,r)=>a+r.sc,0), mx=s.reduce((a,r)=>a+r.mx,0);
  return {f,s,last:f.length?f[f.length-1].wpm:null,best:f.length?Math.max(...f.map(r=>r.wpm)):null,pct:mx?Math.round(sc/mx*100):null,
    fins:R.filter(r=>r.kind==="fin").length, lastT:R.length?Math.max(...R.map(r=>r.t)):null};
}

function buildCSV(){ const rows=[["Name","Datum","Text","Stufe","Art","WpM","Sekunden","Stolperwörter","Rückmeldung","Richtig","Aufgaben","Modus"]];
  DB.records.filter(r=>r.kind!=="fin").sort((a,b)=>a.t-b.t).forEach(r=>rows.push([kidName(r.k),fmt(r.t),unit(r.u)?unit(r.u).title:(r.kind==="test"?"Lese-Check Form "+r.form:"(gelöschter Text)"),LV[r.lv].n,kindLabel(r).replace(/^\S+ /,""),r.wpm??"",r.sec??"",r.err??"",r.fb?Object.values(r.fb).join(" / "):"",r.sc??"",r.mx??"",r.mode==="tandem"?"Tandem":"allein"]));
  return rows.map(r=>r.map(c=>String(c).replace(/;/g,",")).join(";")).join("\n"); }

function emptyEdit(){ return {id:null,title:"",icon:"📄",text:["","",""],words:"",gloss:"",lies:"",qs:[0,1,2,3].map(()=>({q:"",r:"",w1:"",w2:""}))}; }
function syncEdit(){ const e=st.edit; if(!e||!document.getElementById("e_title"))return; const v=id=>{const el=document.getElementById(id);return el?el.value:"";};
  e.title=v("e_title"); e.text=[0,1,2].map(i=>v("e_t"+i)); e.words=v("e_words"); e.gloss=v("e_gloss"); e.lies=v("e_lies");

function pickIcon(i){ syncEdit(); st.edit.icon=i; render(); }
function parseGloss(txt){ return txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(.+?)\s*[=:]\s*(.+)$/); if(!m) return null;
  let e=m[2].trim(), ic=""; const em=e.match(/(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*$/u); if(em){ic=em[1]; e=e.slice(0,em.index).trim();}
  return [m[1].trim().slice(0,40),"",e.slice(0,300),ic]; }).filter(x=>x&&x[0]&&x[2]); }
function autoWords(str){ const seen=new Set(); return toks(str).map(t=>t.replace(/[^A-Za-zÄÖÜäöüß-]/g,"")).filter(t=>t.length>=7&&!seen.has(t.toLowerCase())&&seen.add(t.toLowerCase())).sort((a,b)=>((/^[A-ZÄÖÜ]/.test(b)?100:0)+b.length)-((/^[A-ZÄÖÜ]/.test(a)?100:0)+a.length)).slice(0,5); }
function saveEdit(){
  syncEdit(); const e=st.edit; const text=e.text.map(t=>t.replace(/\s+/g," ").trim());
  if(!e.title.trim()){toast("Bitte einen Titel eingeben");return;} if(!text.some(Boolean)){toast("Bitte mindestens einen Text einfügen");return;}
  const u={id:e.id||("c"+uid()),type:"custom",title:e.title.trim().slice(0,60),icon:e.icon||"📄",text};
  let w=e.words.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean); if(!w.length) w=autoWords(text[1]||text[0]||text[2]); u.words=w.slice(0,12);
  u.gloss=parseGloss(e.gloss);
  u.lies=(e.lies||"").split(/\n+/).map(l=>l.split(/\s*=\s*/)).filter(x=>x.length===2&&x[0].trim()&&x[1].trim()).map(x=>[x[0].trim().slice(0,40),x[1].trim().slice(0,40)]).slice(0,10);
  u.qs=e.qs.filter(q=>q.q.trim()&&q.r.trim()&&(q.w1.trim()||q.w2.trim())).map(q=>({q:q.q.trim(),o:[q.r.trim(),q.w1.trim(),q.w2.trim()].filter(Boolean)}));
  const i=DB.custom.findIndex(x=>x.id===u.id); if(i>=0) DB.custom[i]=u; else DB.custom.push(u);
  save(); st.edit=null; toast("Text gespeichert"); render(); window.scrollTo(0,0);
}
function editCustom(id){ const u=unit(id); if(!u)return; const qs=(u.qs||[]).map(q=>({q:q.q,r:q.o[0]||"",w1:q.o[1]||"",w2:q.o[2]||""})); while(qs.length<4) qs.push({q:"",r:"",w1:"",w2:""});
  st.edit={id:u.id,title:u.title,icon:u.icon,text:u.text.slice(),words:u.words.join(", "),gloss:(u.gloss||[]).map(g=>`${g[0]} = ${g[2]}${g[3]?" "+g[3]:""}`).join("\n"),lies:(u.lies||[]).map(x=>x.join(" = ")).join("\n"),qs}; render(); window.scrollTo(0,0); }
function delCustom(id){ DB.custom=DB.custom.filter(u=>u.id!==id); st.delC=null; save(); render(); }
function exportTexts(){ const c=JSON.stringify({leseflieger:1,texts:DB.custom}); st.exp=c; try{ navigator.clipboard.writeText(c).then(()=>toast("Code kopiert"),()=>toast("Bitte den Code unten markieren und kopieren")); }catch(e){ toast("Bitte den Code unten markieren und kopieren"); } render(); }
function importTexts(){
  const raw=($("#imp").value||"").trim(); let d; try{ d=JSON.parse(raw); }catch(e){ toast("Der Code ist nicht gültig"); return; }
  const arr=d&&Array.isArray(d.texts)?d.texts:null; if(!arr){toast("Der Code ist nicht gültig");return;}
  let n=0; const str=x=>typeof x==="string"?x:"";
  arr.forEach(x=>{ if(!x||!Array.isArray(x.text)||!str(x.title))return;
    const u={id:str(x.id)||("c"+uid()),type:"custom",title:str(x.title).slice(0,60),icon:str(x.icon).slice(0,8)||"📄",
      text:[0,1,2].map(i=>str(x.text[i]).slice(0,6000)), words:(Array.isArray(x.words)?x.words:[]).map(str).filter(Boolean).slice(0,12),
      gloss:(Array.isArray(x.gloss)?x.gloss:[]).filter(Array.isArray).map(g=>[str(g[0]).slice(0,40),str(g[1]).slice(0,100),str(g[2]).slice(0,300),str(g[3]).slice(0,8)]).filter(g=>g[0]&&g[2]),
      lies:(Array.isArray(x.lies)?x.lies:[]).filter(a=>Array.isArray(a)&&a.length===2).map(a=>[str(a[0]).slice(0,40),str(a[1]).slice(0,40)]).filter(a=>a[0]&&a[1]).slice(0,10),
      qs:(Array.isArray(x.qs)?x.qs:[]).filter(q=>q&&str(q.q)&&Array.isArray(q.o)).map(q=>({q:str(q.q),o:q.o.map(str).filter(Boolean).slice(0,4)})).filter(q=>q.o.length>=2)};
    if(!u.text.some(Boolean))return; if(!/^c[a-z0-9]+$/.test(u.id)) u.id="c"+uid();
    const i=DB.custom.findIndex(y=>y.id===u.id); if(i>=0) DB.custom[i]=u; else DB.custom.push(u); n++; });
  save(); toast(n+" Text(e) übernommen"); render();
}

function startAct(id){ st.act=id; st.area=st.area||ACTS.find(a=>a.id===id).g; st.step=0; st.d={sc:0,mx:0,t:{}}; if(id==="sblitz") initBlitz(); if(id==="lie") initLie(); if(id==="theater") initTheater(); go(SCREEN_OF[id],{d:st.d}); }

// ---------- Satz-Hilfen ----------
function splitSentences(str){ const out=[]; let cur=[]; toks(str).forEach(t=>{cur.push(t); if(/[.!?]["“”«»]?$/.test(t)){out.push(cur.join(" "));cur=[];}}); if(cur.length)out.push(cur.join(" ")); return out; }
const clean=t=>t.replace(/^[^A-Za-zÄÖÜäöüß0-9]+|[^A-Za-zÄÖÜäöüß0-9]+$/g,"");

// ---------- 🏁 Lese-Challenge ----------
function vFlowR(){
  const u=st.unit, d=st.d; d.times=d.times||[]; d.acc=d.acc||[]; d.round=d.round||0; const r=d.r||"ready";
  let h=topBar(`🏁 Lese-Challenge: ${esc(u.title)}`,"go('acts')");
  h+=`<div class="card"><p class="instr">Lies den Text <b>dreimal</b> laut. Versuche, jedes Mal ein bisschen schneller zu sein – <b>aber lies genau!</b> ${st.mode==="tandem"?`Es liest <b>${esc(kidName(st.kid))}</b>, ${esc(kidName(st.kid2))} passt auf, dass kein Wort fehlt.`:""}</p>`;
  const prevBest=bestTime(u.id,st.lv);
  h+=`<div class="track">`+[0,1,2].map(i=>{ const t=d.times[i]; let car="", lab="";
     if(t!=null){ car=`<span class="car" style="left:calc(100% - 2.875rem)">🏎️</span>`; lab=`${t} s ${i>0&&t<d.times[i-1]?"🚀":""}${d.acc[i]===false?" 🤔":""}`; }
     else if(i===d.round&&r==="run"){ car=`<span class="car" id="me" style="left:0">🏎️</span>`; const g=i>0?d.times[i-1]:prevBest; if(g) car+=`<span class="car ghost" id="ghost" data-s="${g}" style="left:0">👻</span>`; lab=`<span id="timer">0 s</span>`; }
     else if(i===d.round){ car=`<span class="car" style="left:0">🏎️</span>`; lab="bereit"; }
     return `<div class="lane ${i===d.round&&r!=="end"?"cur":""}"><span class="ln">Runde ${i+1}</span><div class="road"><span class="flag">🏁</span>${car}</div><span class="lt2">${lab}</span></div>`; }).join("")+`</div>`;
  if(r==="ready"&&d.round<3){ const g=d.round>0?d.times[d.round-1]:prevBest;
    h+=`<p class="muted">${g?`👻 Der Geist fährt so schnell wie ${d.round>0?"deine letzte Runde":"deine Bestzeit"} (${g} s). Kommst du vor ihm ins Ziel?`:"Runde 1: Lies in deinem Tempo. Danach versuchst du, schneller zu werden."}</p>
    <div class="row"><button class="btn green" onclick="raceStart()">▶ Start Runde ${d.round+1}</button></div>`; }
  if(r==="run") h+=`<div class="row"><button class="btn red" onclick="raceStop()">⏹ Fertig gelesen</button></div>`;
  if(r==="done"){ const i=d.round, t=d.times[i], p=i>0?d.times[i-1]:null;
    h+=`<div class="fb ${p==null||t<p?"ok":"info"}">${p==null?`⏱️ ${t} Sekunden – das ist deine Startzeit!`:t<p?`🚀 ${p-t} Sekunden schneller als vorher!`:t===p?"⏱️ Genauso schnell wie vorher!":"🐢 Diesmal etwas langsamer – das macht nichts. Genau lesen ist wichtiger!"}</div>
    <p class="q mt">Hast du genau gelesen – ohne Wörter auszulassen?</p><div class="row"><button class="btn sec" onclick="raceAcc(true)">✅ Ja</button><button class="btn sec" onclick="raceAcc(false)">🤔 Nicht ganz</button></div>`; }
  if(r==="end"){ const t=d.times, imp=t[1]<t[0]&&t[2]<t[1];
    h+=`<div class="fb ${imp?"ok":"info"}">${imp?"🏆 Challenge geschafft! Du bist jede Runde schneller geworden.":"👏 Drei Runden gelesen! "+(t[2]<t[0]?`Am Ende warst du ${t[0]-t[2]} Sekunden schneller als am Anfang.`:"Übung macht den Meister – probier es bald nochmal.")}</div>
    <div class="row mt"><span class="sp"></span><button class="btn green" onclick="raceFinish()">Fertig ➜</button></div>`; }
  h+=`<div class="textbox mt"><div class="text" id="txt">${textHTML(fullText(u,st.lv),{nogl:true})}</div></div></div>`;
  return h;
}
function bestTime(uid,lv){ const R=recsOf(st.kid).filter(r=>r.kind==="f"&&r.u===uid&&r.lv===lv&&r.sec); return R.length?Math.min(...R.map(r=>r.sec)):null; }
function raceStart(){ stopAll(); st.d.r="run"; st.d.t0=Date.now(); render();
  const g=document.getElementById("ghost"); if(g){ const s=+g.dataset.s; requestAnimationFrame(()=>requestAnimationFrame(()=>{ g.style.transition=`left ${s}s linear`; g.style.left="calc(100% - 2.875rem)"; })); }
  TIMERS.push(setInterval(()=>{const el=$("#timer"); if(el) el.textContent=Math.floor((Date.now()-st.d.t0)/1000)+" s";},400)); }
function raceStop(){ stopAll(); const d=st.d, sec=Math.max(1,Math.round((Date.now()-d.t0)/1000)); d.times[d.round]=sec; d.r="done";
  const words=wordCount(fullText(st.unit,st.lv)); const rec={k:st.kid,t:Date.now(),kind:"f",ch:1,u:st.unit.id,lv:st.lv,wpm:Math.round(words/(sec/60)),sec,err:null,mode:st.mode};
  if(st.kid){ DB.records.push(rec); save(); d.lastRec=rec; } render(); }
function raceAcc(ok){ const d=st.d; d.acc[d.round]=ok; if(d.lastRec){d.lastRec.fb={genau:ok?"ja":"nicht ganz"}; save();} d.round++; d.r=d.round>=3?"end":"ready"; render(); }
function raceFinish(){ const t=st.d.times, imp=t[1]<t[0]&&t[2]<t[1]; finishFlow("f",3+(imp?2:0),[`Deine Zeiten: ${t.join(" s · ")} s`],null,{improved:imp}); }

// ---------- 🎙️ Aufnehmen & anhören ----------
let IDB=null, MEMBLOB={}, MREC=null;
function idb(){ return new Promise((res,rej)=>{ if(IDB) return res(IDB); try{ const q=indexedDB.open("leseflieger",1); q.onupgradeneeded=()=>q.result.createObjectStore("audio"); q.onsuccess=()=>{IDB=q.result;res(IDB);}; q.onerror=()=>rej(q.error);}catch(e){rej(e);} }); }
async function blobPut(id,b){ try{ const db=await idb(); await new Promise((res,rej)=>{const tx=db.transaction("audio","readwrite"); tx.objectStore("audio").put(b,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error);}); return true; }catch(e){ MEMBLOB[id]=b; return false; } }
async function blobGet(id){ if(MEMBLOB[id]) return MEMBLOB[id]; try{ const db=await idb(); return await new Promise((res,rej)=>{const q=db.transaction("audio").objectStore("audio").get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);}); }catch(e){ return null; } }
async function blobDel(id){ delete MEMBLOB[id]; try{ const db=await idb(); db.transaction("audio","readwrite").objectStore("audio").delete(id);}catch(e){} }
function listRecs(){ render(); }
function recsFor(k,u){ return (DB.recs||[]).filter(r=>r.k===k&&(!u||r.u===u)).sort((a,b)=>a.t-b.t); }

  h+=R.slice().reverse().map(r=>`<div class="kidrow"><span class="nm" style="font-size:1.0625rem">${fmt(r.t)} · ${LV[r.lv].i} ${LV[r.lv].n}${r.sec?` · ${r.sec} s`:""}</span>${playBtn(r)}${st.delR===r.id?`<button class="btn red small" onclick="recDel('${r.id}')">Löschen</button>`:`<button class="btn sec small" onclick="st.delR='${r.id}';render()">🗑️</button>`}</div>`).join("");

const playBtn=r=>`<button class="btn sec small" onclick="playRec('${r.id}')">▶ Anhören</button>`;
async function recStart(){
  try{ if(!navigator.mediaDevices||!window.MediaRecorder) throw new Error("x");
    const stream=await navigator.mediaDevices.getUserMedia({audio:true}); const mr=new MediaRecorder(stream); const ch=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};
    mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); const b=new Blob(ch,{type:mr.mimeType||"audio/mp4"}); saveRec(b,Math.round((Date.now()-st.d.t0)/1000)); };
    MREC=mr; mr.start(); st.d.recording=true; st.d.t0=Date.now(); render();
    TIMERS.push(setInterval(()=>{const el=$("#timer"); if(el){const s=Math.floor((Date.now()-st.d.t0)/1000); el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}},500));
  }catch(e){ st.d.recFail=true; st.d.alt=true; render(); }
}
function recStop(){ clearTimers(); st.d.recording=false; try{MREC&&MREC.stop();}catch(e){} MREC=null; render(); }
function recFile(inp){ const f=inp.files&&inp.files[0]; if(!f)return; saveRec(f,null); }
async function saveRec(b,sec){ st.d.saving=true; render(); const id="r"+uid(); const ok=await blobPut(id,b);
  DB.recs=DB.recs||[]; DB.recs.push({id,k:st.kid,u:st.unit.id,lv:st.lv,t:Date.now(),sec,mime:b.type||"",size:b.size}); save();
  st.d.saving=false; if(!ok) toast("Achtung: Die Aufnahme bleibt nur bis zum Schließen erhalten."); else toast("Aufnahme gespeichert"); render(); }
async function playRec(id){ stopAll(); const r=(DB.recs||[]).find(x=>x.id===id); const b=await blobGet(id); const box=$("#player")||$("#tplayer"); if(!box)return;
  if(!b){ box.innerHTML=`<p class="fb bad">Diese Aufnahme ist auf diesem Gerät nicht mehr vorhanden.</p>`; return; }
  const url=URL.createObjectURL(b); const vid=/video/.test(r&&r.mime||"");
  box.innerHTML=`<div class="card" style="background:var(--blue-l)"><b>▶ ${r?fmt(r.t):""}</b><div class="mt">${vid?`<video src="${url}" controls playsinline style="width:100%;max-height:16.25rem;border-radius:0.75rem"></video>`:`<audio src="${url}" controls style="width:100%"></audio>`}</div></div>`;
  const m=box.querySelector("audio,video"); try{ await m.play(); }catch(e){} box.scrollIntoView({block:"nearest",behavior:"smooth"}); }
async function recDel(id){ await blobDel(id); DB.recs=(DB.recs||[]).filter(r=>r.id!==id); st.delR=null; save(); render(); }

function castLabel(v){ return v==="tts"?"🔊 Stimme":v==="k1"?(st.mode==="solo"?"🙋 ich":esc(kidName(st.kid))):v==="k2"?esc(kidName(st.kid2)):"🧒 Kinder"; }
